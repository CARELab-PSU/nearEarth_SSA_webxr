    ctx.strokeStyle='rgba(0,180,255,0.07)';ctx.lineWidth=0.5;
    for(let g2=0;g2<=1080;g2+=90){ctx.beginPath();ctx.moveTo(g2,0);ctx.lineTo(g2,540);ctx.stroke();}
    for(let g2=0;g2<=540;g2+=45){ctx.beginPath();ctx.moveTo(0,g2);ctx.lineTo(1080,g2);ctx.stroke();}
    worldMapImg=cv;cb(cv);
  };
}

/* ════ OBSERVING CONDITIONS ════
   Sources:
   - 7Timer ASTRO API  → cloud, seeing, transparency, wind
   - SunCalc math      → darkness / limiting magnitude (client-side)
   - AirNow API        → smoke / AQI
================================================================ */

/* --- Sun/Moon math (no external lib needed) --- */
const DEG=Math.PI/180;
function jd(d){return d.getTime()/86400000+2440587.5;}

function sunPos(d){
  let T=(jd(d)-2451545)/36525;
  let L=(280.46646+36000.76983*T)%360;
  let M=(357.52911+35999.05029*T-0.0001537*T*T)*DEG;
  let C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  let lon=(L+C)*DEG;
  let e=23.439291*DEG;
  let ra=Math.atan2(Math.cos(e)*Math.sin(lon),Math.cos(lon));
  let dec=Math.asin(Math.sin(e)*Math.sin(lon));
  return{ra,dec};
}

function moonPos(d){
  let T=(jd(d)-2451545)/36525;
  let L=(218.3164477+481267.88123421*T)*DEG;
  let M=(357.5291092+35999.0502909*T)*DEG;
  let Mm=(134.9634114+477198.8676313*T)*DEG;
  let D=(297.8502042+445267.1115168*T)*DEG;
  let F=(93.2720993+483202.0175273*T)*DEG;
  let lon=L+6.289*DEG*Math.sin(Mm)-1.274*DEG*Math.sin(2*D-Mm)+0.658*DEG*Math.sin(2*D)
          -0.214*DEG*Math.sin(2*Mm)-0.114*DEG*Math.sin(2*F)+1.274*DEG*Math.sin(2*D-M-Mm)+0.658*DEG*Math.sin(2*D-M);
  let lat=5.128*DEG*Math.sin(F)+0.281*DEG*Math.sin(Mm+F)-0.278*DEG*Math.sin(Mm-F)-0.173*DEG*Math.sin(2*D-F);
  let ra=Math.atan2(Math.cos(23.44*DEG)*Math.sin(lon),Math.cos(lon));
  let dec=Math.asin(Math.sin(23.44*DEG)*Math.sin(lon)*Math.cos(lat)+Math.sin(lat)*Math.cos(23.44*DEG));
  let phase=0.5*(1-Math.cos(D*2)); // 0=new,1=full
  return{ra,dec,phase};
}

function altAz(raDec,d,lat,lon){
  // Hour angle
  let T=(jd(d)-2451545)/36525;
  let gmst=((280.46061837+360.98564736629*(jd(d)-2451545))%360+360)%360;
  let lst=(gmst+lon)*DEG;
  let ha=lst-raDec.ra;
  let sinAlt=Math.sin(raDec.dec)*Math.sin(lat*DEG)+Math.cos(raDec.dec)*Math.cos(lat*DEG)*Math.cos(ha);
  let alt=Math.asin(Math.max(-1,Math.min(1,sinAlt)))/DEG;
  return{alt};
}

function limitingMag(d,lat,lon){
  let sun=sunPos(d);let moon=moonPos(d);
  let sunAlt=altAz(sun,d,lat,lon).alt;
  let moonAlt=altAz(moon,d,lat,lon).alt;

  // Daytime/twilight
  if(sunAlt>0) return{lm:null,label:'DAY',dark:0};
  if(sunAlt>-6) return{lm:null,label:'CIVIL',dark:1};
  if(sunAlt>-12) return{lm:3.5,label:'NAUT',dark:2};
  if(sunAlt>-18) return{lm:5.0,label:'ASTRO',dark:3};

  // Night — moon contribution (simplified Krisciunas-Schaefer)
  let base=6.8; // limiting mag at zenith, dark sky, no moon
  if(moonAlt>0){
    let moonFrac=moon.phase; // 0=new,1=full
    let moonPenalty=moonFrac*moonFrac*2.5; // up to ~2.5 mag loss at full moon
    let altBonus=Math.max(0,(moonAlt/90)*0.5);
    base=Math.max(3.5,base-moonPenalty+altBonus);
  }
  return{lm:parseFloat(base.toFixed(1)),label:'NIGHT',dark:4+(moonAlt>0?0:1)};
}

/* Darkness color: dark=0 day, 1 civil, 2 naut, 3 astro, 4 night+moon, 5 night dark */
function darkColor(darkLevel){
  return['#fffde0','#ffe090','#b8e0ff','#5588cc','#1a2a4a','#040810'][Math.min(5,darkLevel)];
}

/* --- 7Timer fetch --- */
/* --- Open-Meteo fetch (CORS-safe, no key needed) --- */
async function fetchWeather(lat,lon){
  // Use observer's IANA timezone so Open-Meteo returns times in local time
  let tz=encodeURIComponent(SITE.tz||'UTC');
  let url=`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&amp;longitude=${lon.toFixed(4)}`
    +`&amp;hourly=cloud_cover,wind_speed_10m,precipitation_probability,cape,lifted_index,dewpoint_2m,temperature_2m`
    +`&amp;forecast_days=2&amp;timezone=${tz}`;
  try{
    let r=await fetch(url,{signal:fetchTimeoutSignal(30000)});
    if(r.ok){
      let j=await r.json();
      if(j&amp;&amp;j.hourly) return j.hourly;
    }
  }catch(e){}
  return null;
}

/* --- AirNow fetch --- */
async function fetchAQI(lat,lon){
  let omUrl=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat.toFixed(4)}&amp;longitude=${lon.toFixed(4)}&amp;current=us_aqi,pm2_5`;
  try{
    let r=await fetch(omUrl,{signal:fetchTimeoutSignal(6000)});
    if(r.ok){
      let j=await r.json();
      if(j&amp;&amp;j.current) return{aqi:j.current.us_aqi,pm25:j.current.pm2_5};
    }
  }catch(e){}
  return null;
}

/* --- Derive seeing (1-5) from CAPE + lifted index --- */
function deriveSee(cape,li){
  // Lifted index: positive=stable(good seeing), negative=unstable(bad seeing)
  // CAPE: 0=stable, >500=convective
  if(li===null||li===undefined) return 3;
  if(li>4&amp;&amp;(cape||0)<100) return 5;   // excellent
  if(li>2&amp;&amp;(cape||0)<300) return 4;   // good
  if(li>0) return 3;                   // average
  if(li>-2) return 2;                  // poor
  return 1;                            // bad
}

/* --- Derive transparency (1-8) from dewpoint depression --- */
function deriveTrans(temp,dew,cloud){
  if(cloud>75) return 1; // too cloudy
  let dep=temp-dew; // dewpoint depression — higher=drier=more transparent
  if(dep>20) return 8;
  if(dep>15) return 7;
  if(dep>12) return 6;
  if(dep>9)  return 5;
  if(dep>6)  return 4;
  if(dep>3)  return 3;
  return 2;
}

/* --- Color helpers --- */
function cloudColor(v){ // 0-100% cloud cover
  if(v<=10) return'#032a1a';
  if(v<=25) return'#054a28';
  if(v<=40) return'#3aaa60';
  if(v<=55) return'#bbbb66';
  if(v<=70) return'#ccaa33';
  if(v<=85) return'#cc5500';
  return'#aa1100';
}
function seeingColor(v){ // 1=bad..5=excellent
  const c=['#aa1100','#cc5500','#bbaa00','#44aa44','#0088ff'];
  return c[Math.min(4,Math.max(0,v-1))];
}
function transpColor(v){ // 1=poor..8=excellent
  const c=['#aa1100','#882200','#aa5500','#999900','#448844','#0066cc','#0044ff','#0022dd'];
  return c[Math.min(7,Math.max(0,v-1))];
}
function windColor(v){ // m/s
  if(v<3) return '#0044cc';
  if(v<6) return '#008844';
  if(v<10) return '#888800';
  if(v<15) return '#cc5500';
  return '#cc1100';
}
function smokeColor(aqi){
  if(aqi===null||aqi===undefined) return'#1a1a2a';
  if(aqi<=50) return'#032a1a';
  if(aqi<=100) return'#887700';
  if(aqi<=150) return'#cc5500';
  if(aqi<=200) return'#aa1100';
  return'#660000';
}

/* --- Tooltip text --- */
const wxTip={
  cloud:v=>'Cloud cover: '+v+'%',
  seeing:v=>{const l=['Bad 1/5','Poor 2/5','Average 3/5','Good 4/5','Excellent 5/5'];return'Seeing: '+l[Math.min(4,v-1)];},
  transp:v=>{const l=['Poor','Below Avg','Below Avg','Average','Above Avg','Transparent','Transparent','Transparent'];return'Transparency: '+l[Math.min(7,v-1)];},
  wind:v=>v.toFixed(1)+' m/s · '+(v*1.944).toFixed(0)+' kt',
  dark:(d,lm)=>d.label+(lm!==null?' · LimMag '+lm:''),
  smoke:aqi=>aqi===null?'AQI: No data':'AQI '+aqi+(aqi<=50?' · Good':aqi<=100?' · Moderate':aqi<=150?' · Unhealthy (sensitive)':' · Unhealthy')
};

/* --- Main fetch &amp; render --- */
let wxData=null;

async function fetchConditions(){
  let lat=SITE.lat_deg,lon=SITE.lon_deg;
  document.getElementById('wx-status').textContent='FETCHING…';
  document.getElementById('wx-site-label').textContent=lat.toFixed(2)+'°N '+Math.abs(lon).toFixed(2)+'°'+(lon>=0?'E':'W');

  let [hourly, aqiData] = await Promise.all([fetchWeather(lat,lon), fetchAQI(lat,lon)]);

  if(!hourly){document.getElementById('wx-status').textContent='WEATHER UNAVAILABLE';return;}

  wxData={hourly,aqiData,lat,lon,fetchedAt:Date.now()};
  renderConditions();
  overlayPasses();
  document.getElementById('wx-status').textContent='UPDATED '+fmtLocalTime(new Date(),SITE.tz).slice(0,5)+' LOCAL';
}

function renderConditions(){
  if(!wxData) return;
  const {hourly,aqiData,lat,lon}=wxData;
  const now=new Date();

  // Find the index of the current hour in the hourly array
  // Open-Meteo now returns times in observer local time e.g. &quot;2026-05-16T10:00&quot;
  const times=hourly.time;
  const nowLocal=fmtLocalTime(now,SITE.tz); // &quot;HH:MM:SS&quot;
  const nowLocalHour=fmtLocalTime(now,SITE.tz).slice(0,13); // unused — match by index instead
  // Build a local date string to match against Open-Meteo's local time strings
  const nowLocalStr=(()=>{
    try{
      return new Intl.DateTimeFormat('sv-SE',{timeZone:SITE.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).format(now).slice(0,13);
    }catch(e){return now.toISOString().slice(0,13);}
  })();
  let startIdx=times.findIndex(t=>t.slice(0,13)===nowLocalStr);
  if(startIdx<0) startIdx=0;

  // Show next 24 hours, one cell per hour
  const numSlots=24;
  const slots=[];
  for(let i=0;i<numSlots;i++){
    let idx=startIdx+i;
    if(idx>=times.length) break;
    // times[idx] is local time string e.g. &quot;2026-05-16T22:00&quot;
    // Convert to real UTC using the site's known offset (tzOffsetMin)
    let localHour=parseInt(times[idx].slice(11,13));
    // Parse local string as if UTC, then subtract the local offset to get true UTC
    let localMs=Date.parse(times[idx]+':00Z'); // treat as UTC first
    let slotUTC=new Date(localMs - SITE.tzOffsetMin*60000); // shift back to real UTC
    slots.push({
      localHour,
      slotUTC,
      cloud: hourly.cloud_cover[idx]??50,
      wind:  hourly.wind_speed_10m[idx]??0,
      cape:  hourly.cape[idx]??0,
      li:    hourly.lifted_index[idx]??0,
      temp:  hourly.temperature_2m[idx]??10,
      dew:   hourly.dewpoint_2m[idx]??5,
    });
  }

  // Clear all cells
  ['wx-hours','wx-cloud','wx-seeing','wx-transp','wx-dark','wx-wind','wx-smoke'].forEach(id=>{
    document.getElementById(id).innerHTML='';
  });

  const tooltip=document.getElementById('tooltip');

  slots.forEach((s,i)=>{
    let hh=padZ(s.localHour);
    let dark=limitingMag(s.slotUTC,lat,lon);
    let see=deriveSee(s.cape,s.li);
    let trans=deriveTrans(s.temp,s.dew,s.cloud);

    let defs=[
      {id:'wx-hours', label:hh,  bg:'transparent', color:'var(--muted)', tip:null},
      {id:'wx-cloud', bg:cloudColor(s.cloud),  tip:wxTip.cloud(Math.round(s.cloud))},
      {id:'wx-seeing',bg:seeingColor(see),     tip:wxTip.seeing(see)},
      {id:'wx-transp',bg:transpColor(trans),   tip:wxTip.transp(trans)},
      {id:'wx-dark',  bg:darkColor(dark.dark), tip:wxTip.dark(dark,dark.lm)},
      {id:'wx-wind',  bg:windColor(s.wind),    tip:wxTip.wind(s.wind)},
      {id:'wx-smoke', bg:smokeColor(aqiData?.aqi), tip:wxTip.smoke(aqiData?.aqi)},
    ];

    defs.forEach(d=>{
      let cell=document.createElement('div');
      cell.className='wx-cell';
      cell.style.background=d.bg;
      if(d.label){
        cell.style.display='flex';cell.style.alignItems='center';cell.style.justifyContent='center';
        cell.style.fontSize='6px';cell.style.color=d.color||'var(--muted)';
        cell.style.fontFamily='var(--font-hud)';cell.textContent=d.label;
        cell.style.background='transparent';cell.style.height='10px';
      }
      if(d.tip){
        cell.addEventListener('mouseenter',e=>{
          tooltip.textContent=d.tip;tooltip.style.display='block';
          tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-24)+'px';
        });
        cell.addEventListener('mousemove',e=>{
          tooltip.style.left=(e.clientX+12)+'px';tooltip.style.top=(e.clientY-24)+'px';
        });
        cell.addEventListener('mouseleave',()=>{tooltip.style.display='none';});
      }
      document.getElementById(d.id).appendChild(cell);
    });
  });
}

/* ════ PASS OVERLAY ON CONDITIONS STRIP ════
   After conditions render, mark hours that fall within a predicted pass.
   Called after renderConditions() and after selectSat().             */
function overlayPasses(){
  if(!wxData||!currentPasses||!currentTLE||!propagationTime) return;
  const cloudCells=document.getElementById('wx-cloud').children;
  if(!cloudCells.length) return;

  const numCells=cloudCells.length;
  // Each cell i corresponds to slotUTC[i] — rebuild times from wxData
  const {hourly}=wxData;
  const times=hourly.time;
  const startIdx=(()=>{
    const nowLocalStr=(()=>{
      try{return new Intl.DateTimeFormat('sv-SE',{timeZone:SITE.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hour12:false}).format(new Date()).slice(0,13);}
      catch(e){return new Date().toISOString().slice(0,13);}
    })();
    let idx=times.findIndex(t=>t.slice(0,13)===nowLocalStr);
    return idx<0?0:idx;
  })();

  // Remove any existing pass overlays
  document.querySelectorAll('.wx-pass-overlay').forEach(el=>el.remove());

  // For each pass, find which hour cells it overlaps
  const rows=['wx-cloud','wx-seeing','wx-transp','wx-dark','wx-wind','wx-smoke'];

  currentPasses.forEach((p,pi)=>{
    // p.t_rise / p.t_set are seconds from propagationTime
    let riseUTC=new Date(propagationTime.getTime()+p.t_rise*1000);
    let setUTC =new Date(propagationTime.getTime()+p.t_set*1000);
    let elPk=p.el_peak;
    let col=elPk>30?'rgba(0,255,136,0.55)':elPk>10?'rgba(255,170,0,0.45)':'rgba(100,150,255,0.35)';
    let border=elPk>30?'#00ff88':elPk>10?'#ffaa00':'#6699ff';

    for(let i=0;i<numCells;i++){
      let idx=startIdx+i;
      if(idx>=times.length) break;
      // Get UTC instant for this cell
      let localMs=Date.parse(times[idx]+':00Z');
      let cellUTC=new Date(localMs-SITE.tzOffsetMin*60000);
      let cellEnd=new Date(cellUTC.getTime()+3600000);
      // Check overlap: pass overlaps cell if rise<cellEnd &amp;&amp; set>cellStart
      if(riseUTC<cellEnd &amp;&amp; setUTC>cellUTC){
        rows.forEach(rowId=>{
          let cells=document.getElementById(rowId).children;
          if(i<cells.length){
            let overlay=document.createElement('div');
            overlay.className='wx-pass-overlay';
            overlay.style.cssText=`position:absolute;inset:0;background:${col};border-top:2px solid ${border};border-bottom:2px solid ${border};pointer-events:none;z-index:3;`;
            // First cell of pass: left border
            let localRiseMs=Date.parse(times[idx]+':00Z')-SITE.tzOffsetMin*60000;
            if(riseUTC>=cellUTC) overlay.style.borderLeft=`2px solid ${border}`;
            if(setUTC<=cellEnd)  overlay.style.borderRight=`2px solid ${border}`;
            cells[i].style.position='relative';
            cells[i].appendChild(overlay);
          }
        });
        // Also add tooltip enhancement to hour cell
        let hCells=document.getElementById('wx-hours').children;
        if(i<hCells.length){
          let tip=document.getElementById('tooltip');
          let passLabel=`${currentTLE.name} · ${fmtLocalShort(riseUTC,SITE.tz)}–${fmtLocalShort(setUTC,SITE.tz)} · peak ${elPk.toFixed(0)}°`;
          hCells[i].style.color=border;
          hCells[i].style.fontWeight='bold';
          // Attach tooltip
          hCells[i].addEventListener('mouseenter',e=>{tip.textContent=passLabel;tip.style.display='block';tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-24)+'px';});
          hCells[i].addEventListener('mousemove',e=>{tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY-24)+'px';});
          hCells[i].addEventListener('mouseleave',()=>{tip.style.display='none';});
        }
      }
    }
  });
}


/* ════ V2 · CATALOG 3D — full-catalog real-time inertial viewer ════
   Propagation strategy (accuracy-honest at every time scale):
   · every object is seeded with SGP4 at the current sim epoch;
   · between SGP4 fixes, motion is bridged with a symplectic-Euler two-body
     integration (substeps ≤ 8 s of sim time) — energy-stable, no secular drift;
   · a time-boxed (≈3 ms/frame) background sweep continuously re-anchors objects
     with fresh SGP4 fixes, cycling through the whole catalog, so the two-body
     bridge never accumulates more than a few seconds–minutes of drag/J2 error.
   Earth orientation: rotation.y = GMST(simTime) — same convention as ECI view. */
const CAT={
  three:null,sats:[],mesh:null,
  anchorIdx:0,selected:-1,hoverIdx:-1,
  _ray:null,_mouse:null,_mouseEv:null,_hoverLast:0,
  _orbitT:0,_cardLast:0,_loadToken:0,inited:false,
  _dummyM:null,

  /* full tracked-environment buckets: payloads, rocket bodies, debris fields */
  GROUPS:[
    {id:'__full',  n:'FULL PUBLIC CATALOG (EVERYTHING TRACKED)', on:true},
    {id:'visual',  n:'100 BRIGHTEST',        on:true},
    {id:'stations',n:'SPACE STATIONS',       on:true},
    {id:'active',  n:'ACTIVE PAYLOADS (ALL)',on:true},
    {id:'starlink',n:'STARLINK',             on:false},
    {id:'oneweb',  n:'ONEWEB',               on:false},
    {id:'gps-ops', n:'GPS OPS',              on:false},
    {id:'glo-ops', n:'GLONASS',              on:false},
    {id:'galileo', n:'GALILEO',              on:false},
    {id:'beidou',  n:'BEIDOU',               on:false},
    {id:'geo',     n:'GEO BELT',             on:false},
    {id:'weather', n:'WEATHER',              on:false},
    {id:'science', n:'SCIENCE',              on:false},
    {id:'cosmos-2251-debris', n:'COSMOS-2251 DEBRIS', on:true},
    {id:'iridium-33-debris',  n:'IRIDIUM-33 DEBRIS',  on:true},
    {id:'fengyun-1c-debris',  n:'FENGYUN-1C DEBRIS',  on:true},
    {id:'cosmos-1408-debris', n:'COSMOS-1408 DEBRIS', on:false},
    {id:'last-30-days',       n:'LAUNCHED <30 DAYS',  on:false}
  ],
  /* object classes: payloads colored by regime; debris + rocket bodies get
     their own classes so the full junk environment reads at a glance */
  CLS_COLOR:{LEO:[1,0.82,0.29],MEO:[0,1,0.70],GEO:[1,0.31,0.85],HEO:[0.69,0.55,1],MOLNIYA:[0.69,0.55,1],
             DEB:[0.62,0.72,0.80],RB:[1,0.48,0.29]},
  classOf(t){
    if(t.objType==='DEBRIS') return 'DEB';
    if(t.objType==='RB') return 'RB';
    const n=t.name.toUpperCase();
    if(/\bDEB\b|DEBRIS/.test(n)) return 'DEB';
    if(/R\/B|\bAKM\b|\bPKM\b/.test(n)) return 'RB';
    return t.orbitType==='MOLNIYA'?'HEO':t.orbitType;
  },
  /* coarse object_type from a TLE name (for CelesTrak-sourced buckets that
     don't carry OrbitSmith's explicit object_type field) */
  objTypeOfName(t){
    const n=(t.name||'').toUpperCase();
    if(/\bDEB\b|DEBRIS/.test(n)) return 'DEBRIS';
    if(/R\/B|\bAKM\b|\bPKM\b|ROCKET/.test(n)) return 'RB';
    return 'PAYLOAD';
  },
  filter:'ALL',
  matchesFilter(objType){
    const f=this.filter;
    if(f==='ALL') return true;
    if(f==='ACTIVE') return objType==='PAYLOAD';
    if(f==='DEBRIS') return objType==='DEBRIS';
    if(f==='RB') return objType==='RB';
    return true;
  },
  setFilter(f,btn){
    this.filter=f;
    document.querySelectorAll('#cat-filter-bar .cfb-btn').forEach(b=>b.classList.remove('on'));
    if(btn) btn.classList.add('on');
    if(this.sats) for(const s of this.sats) s.vis=this.matchesFilter(s.objType);
    this.applyZoomScale(true);
    this.updateCounts();
    if(typeof STATE!=='undefined') STATE.dirty();
  },

  init(){
    if(this.inited) return;
    this.inited=true;
    if(HEADLESS) return;   /* VR draws the catalog itself; only the data pipeline is needed */
    this.three=initThree3D('cat-canvas-wrap',{axes:false,rad:RE_KM*6.2});
    this._ray=new THREE.Raycaster();
    this._mouse=new THREE.Vector2();
    const dom=this.three.renderer.domElement;
    dom.addEventListener('pointermove',e=>{
      const r=dom.getBoundingClientRect();
      this._mouse.x=((e.clientX-r.left)/r.width)*2-1;
      this._mouse.y=-((e.clientY-r.top)/r.height)*2+1;
      this._mouseEv=e;
    });
    let downXY=null;
    dom.addEventListener('pointerdown',e=>downXY=[e.clientX,e.clientY]);
    dom.addEventListener('pointerup',e=>{
      if(!downXY) return;
      const moved=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);
      downXY=null;
      if(moved<5) this.clickPick();
    });
    this.renderGroupMenu();
    document.getElementById('cat-groups-btn').addEventListener('click',e=>{
      e.stopPropagation();
      document.getElementById('cat-groups-menu').classList.toggle('open');
    });
    document.addEventListener('click',e=>{
      const m=document.getElementById('cat-groups-menu');
      if(m&amp;&amp;!m.contains(e.target)&amp;&amp;e.target.id!=='cat-groups-btn') m.classList.remove('open');
    });
  },

  renderGroupMenu(){
    const m=document.getElementById('cat-groups-menu');
    const allOn=this.GROUPS.every(g=>g.on);
    m.innerHTML='<label class=&quot;cg-item cg-all&quot;><input type=&quot;checkbox&quot; id=&quot;cg-selall&quot; '+(allOn?'checked':'')+'/> ★ SELECT ALL</label>'+
      this.GROUPS.map((g,i)=>
      '<label class=&quot;cg-item&quot;><input type=&quot;checkbox&quot; data-i=&quot;'+i+'&quot; '+(g.on?'checked':'')+'/> '+g.n+'</label>').join('')+
      '<button class=&quot;hud-btn amber&quot; style=&quot;margin:6px;&quot; onclick=&quot;CAT.loadChecked()&quot;>⟳ LOAD SELECTED</button>';
    m.querySelectorAll('input[data-i]').forEach(inp=>inp.addEventListener('change',e=>{
      this.GROUPS[+e.target.dataset.i].on=e.target.checked;
      if(typeof STATE!=='undefined') STATE.dirty();
    }));
    document.getElementById('cg-selall').addEventListener('change',e=>{
      this.GROUPS.forEach(g=>g.on=e.target.checked);
      this.renderGroupMenu();
      document.getElementById('cat-groups-menu').classList.add('open');
      if(typeof STATE!=='undefined') STATE.dirty();
    });
    const btn=document.getElementById('cat-groups-btn');
    if(btn) btn.textContent='BUCKETS ('+this.GROUPS.filter(g=>g.on).length+') ▾';
  },
  _groupCache:{},
  async loadChecked(){
    const token=++this._loadToken;
    document.getElementById('cat-groups-menu').classList.remove('open');
    const want=this.GROUPS.filter(g=>g.on);
    const btn=document.getElementById('cat-groups-btn');
    if(btn) btn.textContent='BUCKETS ('+want.length+') ▾';
    const prog=document.getElementById('cat-progress'),ptxt=document.getElementById('cat-progress-txt');
    prog.style.display='flex';
    this.deselect();
    /* combined buckets, deduped by NORAD id */
    const byNorad=new Map();
    let gotAny=false;
    for(let gi=0;gi<want.length;gi++){
      if(token!==this._loadToken) return;
      ptxt.textContent='Fetching '+want[gi].n+' ('+(gi+1)+'/'+want.length+')…';
      let raw=this._groupCache[want[gi].id];
      if(raw===undefined){
        if(want[gi].id==='__full'){
          /* primary: OrbitSmith static mirror (full ~34.6k + object_type) */
          ptxt.textContent='Loading full catalog from OrbitSmith…';
          raw=await OS.fetchCatalog((d,tot,nObj)=>{ptxt.textContent='OrbitSmith catalog — shard '+d+' / '+tot+' · '+nObj+' objects…';});
          if(raw){this._srcLabel='ORBITSMITH (OFFLINE MIRROR)';}
          else{
            /* fallback: live CelesTrak full dump */
            ptxt.textContent='OrbitSmith unreachable — falling back to CelesTrak…';
            raw=await fetchFullCatalog(p=>{ptxt.textContent='CelesTrak full catalog… '+(p/1048576).toFixed(1)+' MB';});
            if(raw) this._srcLabel='CELESTRAK GP (FALLBACK)';
          }
        }else{
          raw=await fetchGroup(want[gi].id);
          if(raw&amp;&amp;!this._srcLabel) this._srcLabel='CELESTRAK GP';
        }
        if(raw) this._groupCache[want[gi].id]=raw;
      }
      if(token!==this._loadToken) return;
      if(!raw) continue;
      gotAny=true;
      if(Array.isArray(raw)){
        /* OrbitSmith path: objects already parsed + objType-tagged */
        raw.forEach(t=>{if(t.satrec&amp;&amp;!byNorad.has(t.satnum)) byNorad.set(t.satnum,t);});
      }else{
        parseCatalog(raw).forEach(t=>{if(t.satrec&amp;&amp;!byNorad.has(t.satnum)){t.objType=this.objTypeOfName(t);byNorad.set(t.satnum,t);}});
      }
    }
    let parsed=[...byNorad.values()];
    if(!gotAny){parsed=getFallbackSats().filter(t=>t.satrec);parsed.forEach(t=>t.objType=this.objTypeOfName(t));this._srcLabel='EMBEDDED SAMPLE';ptxt.textContent='⚠ All sources blocked — embedded sample set';}
    else ptxt.textContent=parsed.length+' unique objects merged — building instanced buffer…';
    document.getElementById('cat-src-stamp').textContent=(this._srcLabel||'CATALOG')+' · FETCHED '+fmtUTCShort(new Date())+'Z · '+parsed.length+' OBJ';
    this._srcLabel=null;
    this.buildInstanced(parsed,token,prog,ptxt);
  },
  /* ── Instanced WebGL strategy: ONE hardware-accelerated draw call for the
        entire tracked environment (tens of thousands of objects). Round
        geometry (icosahedron) — no square points anywhere. Per-frame motion
        writes translation terms straight into the instance matrix buffer. ── */
  buildInstanced(parsed,token,prog,ptxt){
    this.sats=parsed.map(t=>{const ot=t.objType||this.objTypeOfName(t);return{tle:t,cls:this.classOf(t),objType:ot,vis:this.matchesFilter(ot),r:[0,0,0],v:[0,0,0],ok:false};});
    if(!this.three){ prog.style.display='none'; this.updateCounts(); return; }   /* headless: no instanced mesh, no duplicate SGP4 seeding */
    if(this.mesh){this.three.scene.remove(this.mesh);this.mesh.geometry.dispose();this.mesh.material.dispose();this.mesh=null;}
    const n=this.sats.length;
    const geo=new THREE.IcosahedronGeometry(1,1);
    const mat=new THREE.MeshBasicMaterial({transparent:true,opacity:0.95});
    const mesh=new THREE.InstancedMesh(geo,mat,n);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    const M=new THREE.Matrix4();
    for(let i=0;i<n;i++){
      const cls=this.sats[i].cls;
      const sc=cls==='DEB'?26:cls==='RB'?38:46;       /* debris renders smaller */
      this.sats[i].sc=sc;
      M.makeScale(sc,sc,sc);M.setPosition(0,-1e9,0);  /* park off-screen until seeded */
      mesh.setMatrixAt(i,M);
      const c=this.CLS_COLOR[cls]||[0.7,0.7,0.8];
      mesh.setColorAt(i,new THREE.Color(c[0],c[1],c[2]));
    }
    mesh.frustumCulled=false;
    mesh.instanceMatrix.needsUpdate=true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate=true;
    this.mesh=mesh;
    this.three.scene.add(mesh);
    /* chunked SGP4 seed so the UI never blocks */
    let i=0;
    const seedChunk=()=>{
      if(token!==this._loadToken) return;
      const t0=performance.now();
      const d=EPOCH.now();
      while(i<n&amp;&amp;performance.now()-t0<11){this.anchorOne(i,d);i++;}
      ptxt.textContent='Seeding SGP4 states… '+i+' / '+n;
      this.mesh.instanceMatrix.needsUpdate=true;
      if(i<n) requestAnimationFrame(seedChunk);
      else{prog.style.display='none';this.updateCounts();this.applyZoomScale(true);}
    };
    requestAnimationFrame(seedChunk);
    this.updateCounts();
  },

  /* one SGP4 fix → state vectors + GPU buffer (orbital → three coords: x, z, −y) */
  anchorOne(i,d){
    const s=this.sats[i],a=this.mesh.instanceMatrix.array,o=i*16;
    try{
      const pv=satellite.propagate(s.tle.satrec,d);
      if(pv&amp;&amp;pv.position&amp;&amp;isFinite(pv.position.x)){
        s.r[0]=pv.position.x;s.r[1]=pv.position.y;s.r[2]=pv.position.z;
        s.v[0]=pv.velocity.x;s.v[1]=pv.velocity.y;s.v[2]=pv.velocity.z;
        s.ok=true;
        a[o+12]=s.r[0];a[o+13]=s.r[2];a[o+14]=-s.r[1];
        return;
      }
    }catch(e){}
    s.ok=false;a[o+13]=-1e9;
  },

  /* time controls forward to the GLOBAL epoch clock — full lockstep */
  setScale(k,btn){
    EPOCH.setRate(k);
    document.querySelectorAll('#cat-toolbar .tw-btn').forEach(b=>b.classList.remove('on'));
    if(btn) btn.classList.add('on');
    document.getElementById('tw-pause').textContent='⏸';
  },
  setPause(){
    EPOCH.togglePause();
    document.getElementById('tw-pause').textContent=EPOCH.rate===0?'▶':'⏸';
    document.getElementById('tw-pause').classList.toggle('on',EPOCH.rate===0);
  },
  resetNow(){
    EPOCH.live();
    const d=EPOCH.now();
    for(let i=0;i<this.sats.length;i++) this.anchorOne(i,d);
    if(this.mesh) this.mesh.instanceMatrix.needsUpdate=true;
    this.anchorIdx=0;
    if(this.selected>=0) this.drawSelOrbit();
  },

  updateCounts(){
    const by={};let shown=0;
    this.sats.forEach(s=>{by[s.cls]=(by[s.cls]||0)+1;if(s.vis!==false)shown++;});
    const fl=this.filter&amp;&amp;this.filter!=='ALL'?' · '+this.filter+' ('+shown+' SHOWN)':'';
    document.getElementById('cat-counts').textContent=
      this.sats.length+' OBJ · PAYLOAD '+((by.LEO||0)+(by.MEO||0)+(by.GEO||0)+(by.HEO||0))+
      ' · DEBRIS '+(by.DEB||0)+' · R/B '+(by.RB||0)+fl+' · 1 DRAW CALL';
  },

  /* zoom-adaptive geometric scale: markers shrink toward true point objects as
     the camera closes in; grow for legibility when zoomed far out */
  _lastScaleRad:0,
  applyZoomScale(force){
    if(!this.mesh) return;
    const rad=this.three.ctrl.rad,R0=RE_KM*6.2;
    if(!force&amp;&amp;Math.abs(rad-this._lastScaleRad)/Math.max(rad,1)<0.04) return;
    this._lastScaleRad=rad;
    const f=Math.min(3,Math.max(0.06,Math.pow(rad/R0,1.3)));
    const a=this.mesh.instanceMatrix.array;
    for(let i=0;i<this.sats.length;i++){
      const vis=this.sats[i].vis!==false;
      const sc=vis?this.sats[i].sc*f:0,o=i*16;
      a[o]=sc;a[o+5]=sc;a[o+10]=sc;
    }
    this.mesh.instanceMatrix.needsUpdate=true;
  },

  /* per-frame: advance sim clock, bridge-integrate, re-anchor, render */
  frame(nowP,dt){
    const T=this.three;
    T.ctrl.update(dt);
    this.applyZoomScale(false);
    const dtSim=dt*EPOCH.rate;            /* sim seconds this frame (global clock) */
    if(this.sats.length&amp;&amp;this.mesh&amp;&amp;Math.abs(dtSim)>1e-9){
      /* symplectic Euler two-body bridge, substeps ≤ 8 s */
      const nSub=Math.max(1,Math.ceil(Math.abs(dtSim)/8));
      const h=dtSim/nSub;
      const arr=this.mesh.instanceMatrix.array;
      for(let i=0;i<this.sats.length;i++){
        const s=this.sats[i];
        if(!s.ok) continue;
        let[rx,ry,rz]=s.r,[vx,vy,vz]=s.v;
        for(let q=0;q<nSub;q++){
          const r2=rx*rx+ry*ry+rz*rz,r1=Math.sqrt(r2);
          const k=-MU_E/(r2*r1)*h;
          vx+=k*rx;vy+=k*ry;vz+=k*rz;     /* kick */
          rx+=vx*h;ry+=vy*h;rz+=vz*h;     /* drift */
        }
        s.r[0]=rx;s.r[1]=ry;s.r[2]=rz;s.v[0]=vx;s.v[1]=vy;s.v[2]=vz;
        const o=i*16;
        arr[o+12]=rx;arr[o+13]=rz;arr[o+14]=-ry;
      }
      /* time-boxed SGP4 re-anchor sweep (~3 ms budget) */
      const t0=performance.now(),d=EPOCH.now();
      let nA=0;
      while(performance.now()-t0<3&amp;&amp;nA<this.sats.length){
        this.anchorOne(this.anchorIdx,d);
        this.anchorIdx=(this.anchorIdx+1)%this.sats.length;
        nA++;
      }
      this.mesh.instanceMatrix.needsUpdate=true;
    }
    /* Earth orientation + Sun direction at the SIM epoch — true physics under acceleration */
    const simD=EPOCH.now();
    if(T.earthMesh) T.earthMesh.rotation.y=gmst_from_jd(julianDate(simD));
    if(nowP-(this._sunT||0)>250){this._sunT=nowP;T.setSun(sunECIUnit(simD));}
    /* clocks (global epoch) */
    const sd=simD;
    document.getElementById('cat-simclock').textContent=
      sd.toISOString().slice(0,19).replace('T',' ')+' UTC'+(EPOCH.rate===0?' ⏸':'');
    const off=EPOCH.offsetMs()/1000;
    document.getElementById('cat-simoffset').textContent=
      Math.abs(off)<2?'· REAL TIME':(off>0?'· +':'· −')+fmtHMS(Math.abs(off))+' vs now';
    /* hover picking (throttled) */
    if(nowP-this._hoverLast>70&amp;&amp;this.mesh){this._hoverLast=nowP;this.hoverPick();}
    /* selected: live marker + card */
    if(this.selected>=0){
      const s=this.sats[this.selected];
      const mk=T.scene.getObjectByName('catSelMk');
      if(mk&amp;&amp;s.ok) mk.position.set(s.r[0],s.r[2],-s.r[1]);
      if(nowP-this._cardLast>400){this._cardLast=this._cardLast=nowP;this.updateCard();}
      if(nowP-this._orbitT>60000){this._orbitT=nowP;this.drawSelOrbit();}
    }
    T.renderer.render(T.scene,T.camera);
  },

  raySetup(){
    this._ray.setFromCamera(this._mouse,this.three.camera);
  },
  pick(){
    this.raySetup();
    const hits=this._ray.intersectObject(this.mesh);
    return hits.length?hits[0].instanceId:-1;
  },
  hoverPick(){
    const hv=document.getElementById('cat-hover');
    if(!this._mouseEv){hv.style.display='none';return;}
    const i=this.pick();
    if(i>=0){
      this.hoverIdx=i;
      const s=this.sats[i],t=s.tle;
      const alt=Math.sqrt(s.r[0]**2+s.r[1]**2+s.r[2]**2)-RE_KM;
      const spd=Math.sqrt(s.v[0]**2+s.v[1]**2+s.v[2]**2);
      hv.innerHTML='<div class=&quot;ch-name&quot;>'+t.name+'</div>'+
        '<div class=&quot;ch-row&quot;><span>NORAD</span><span>'+t.satnum+' · '+(s.cls==='DEB'?'DEBRIS':s.cls==='RB'?'ROCKET BODY':t.orbitType)+'</span></div>'+
        '<div class=&quot;ch-row&quot;><span>ALT</span><span>'+alt.toFixed(0)+' km</span></div>'+
        '<div class=&quot;ch-row&quot;><span>SPEED</span><span>'+spd.toFixed(2)+' km/s</span></div>'+
        '<div class=&quot;ch-row&quot;><span>INC / T</span><span>'+t.inc.toFixed(1)+'° · '+(t.T_s/60).toFixed(0)+' min</span></div>'+
        '<div class=&quot;ch-row&quot; style=&quot;color:var(--muted);margin-top:3px;&quot;><span>CLICK</span><span>ORBIT + DETAILS</span></div>';
      const wrap=document.getElementById('cat-stage').getBoundingClientRect();
      let x=this._mouseEv.clientX-wrap.left+14,y=this._mouseEv.clientY-wrap.top+10;
      hv.style.display='block';
      const hw=hv.offsetWidth,hh=hv.offsetHeight;
      if(x+hw>wrap.width-8)x=this._mouseEv.clientX-wrap.left-hw-12;
      if(y+hh>wrap.height-8)y=wrap.height-hh-8;
      hv.style.left=x+'px';hv.style.top=y+'px';
      this.three.renderer.domElement.style.cursor='pointer';
    } else {
      this.hoverIdx=-1;hv.style.display='none';
      this.three.renderer.domElement.style.cursor='grab';
    }
  },
  clickPick(){
    const i=this.pick();
    if(i>=0) this.select(i);
  },

  select(i){
    this.selected=i;
    const T=this.three,s=this.sats[i];
    let mk=T.scene.getObjectByName('catSelMk');
    if(!mk){
      mk=new THREE.Mesh(new THREE.SphereGeometry(120,14,14),new THREE.MeshBasicMaterial({color:0xffcc00}));
      mk.name='catSelMk';T.scene.add(mk);
    }
    mk.position.set(s.r[0],s.r[2],-s.r[1]);
    this._orbitT=performance.now();
    this.drawSelOrbit();
    document.getElementById('cat-card').style.display='block';
    document.getElementById('cc-name').textContent=s.tle.name;
    this.updateCard();
  },
  /* one-period orbit sampled directly from SGP4 (true osculating + perturbed path) */
  drawSelOrbit(){
    const T=this.three;
    let old=T.scene.getObjectByName('catSelOrbit');
    if(old){T.scene.remove(old);old.geometry.dispose();old.material.dispose();}
    if(this.selected<0) return;
    const s=this.sats[this.selected];
    const P=s.tle.T_s,NPTS=160,pts=[];
    for(let k=0;k<=NPTS;k++){
      const d=new Date(EPOCH.ms()+(k/NPTS)*P*1000);
      try{
        const pv=satellite.propagate(s.tle.satrec,d);
        if(pv&amp;&amp;pv.position&amp;&amp;isFinite(pv.position.x))
          pts.push(new THREE.Vector3(pv.position.x,pv.position.z,-pv.position.y));
      }catch(e){}
    }
    if(pts.length<2) return;
    const g=new THREE.BufferGeometry().setFromPoints(pts);
    const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffcc00,transparent:true,opacity:.85}));
    line.name='catSelOrbit';T.scene.add(line);
  },
  updateCard(){
    if(this.selected<0) return;
    const s=this.sats[this.selected],t=s.tle;
    const rmag=Math.sqrt(s.r[0]**2+s.r[1]**2+s.r[2]**2);
    const spd=Math.sqrt(s.v[0]**2+s.v[1]**2+s.v[2]**2);
    /* sub-satellite point at sim epoch */
    const gm=gmst_from_jd(julianDate(EPOCH.now()));
    const ct=Math.cos(gm),st=Math.sin(gm);
    const fx=ct*s.r[0]+st*s.r[1],fy=-st*s.r[0]+ct*s.r[1],fz=s.r[2];
    const lon=((Math.atan2(fy,fx)*R2D+540)%360)-180;
    const lat=Math.atan2(fz,Math.sqrt(fx*fx+fy*fy))*R2D;
    const apo=t.a*(1+t.ecc)-RE_KM,per=t.a*(1-t.ecc)-RE_KM;
    const sl=isSunlit(s.r,sunECIUnit(EPOCH.now()));
    document.getElementById('cc-grid').innerHTML=
      row('NORAD',t.satnum)+row('CLASS',t.orbitType)+
      row('ALT',(rmag-RE_KM).toFixed(1)+' km')+row('SPEED',spd.toFixed(3)+' km/s')+
      row('SUBPOINT',lat.toFixed(2)+'°, '+lon.toFixed(2)+'°')+row('ILLUM',sl?'SUNLIT ☀':'IN SHADOW ●')+
      row('APOGEE',apo.toFixed(0)+' km')+row('PERIGEE',per.toFixed(0)+' km')+
      row('INC',t.inc.toFixed(3)+'°')+row('PERIOD',(t.T_s/60).toFixed(2)+' min')+
      row('ECC',t.ecc.toFixed(6))+row('RAAN',t.raan.toFixed(2)+'°');
    function row(k,v){return'<div class=&quot;cc-row&quot;><span class=&quot;cc-k&quot;>'+k+'</span><span class=&quot;cc-v&quot;>'+v+'</span></div>';}
  },
  deselect(){
    this.selected=-1;
    document.getElementById('cat-card').style.display='none';
    if(this.three){
      const o=this.three.scene.getObjectByName('catSelOrbit');
      if(o){this.three.scene.remove(o);o.geometry.dispose();o.material.dispose();}
      const m=this.three.scene.getObjectByName('catSelMk');
      if(m) this.three.scene.remove(m);
    }
  },
  trackSelected(){
    if(this.selected<0) return;
    const t=this.sats[this.selected].tle;
    let found=allSats.find(x=>x.satnum===t.satnum);
    if(!found){allSats.unshift(t);populateList(allSats);found=t;}
    switchView('tracker');
    /* find its list item to highlight */
    let item=null;
    document.querySelectorAll('#sat-list .sat-item').forEach(el=>{
      if(el.querySelector('.sat-meta')&amp;&amp;el.querySelector('.sat-meta').textContent.includes(String(found.satnum))) item=el;
    });
    selectSat(found,item);
    if(item) item.scrollIntoView({block:'center'});
  }
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  MODULE · EphemerisService — deep-space pipeline (non-TLE class)  ║
   ║  · Fuzzy name resolution  → JPL Small-Body Database Lookup API    ║
   ║  · State-vector packets   → JPL Horizons EPHEM_TYPE=VECTORS       ║
   ║  · Rate-limit protection  → IndexedDB + in-memory packet cache    ║
   ║  · Fluid animation        → cubic Hermite interpolation (uses     ║
   ║    BOTH position and velocity samples ⇒ C¹-continuous motion)     ║
   ║  · Frame bridge           → ECI (equatorial, km) ⇄ heliocentric   ║
   ║    ecliptic J2000 (AU) into one unified scene space               ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const AU_KM=149597870.7;
const EPHSVC={
  mem:{},            /* in-memory packet cache  cmd|window → pack */
  _db:null,_dbFail:false,

  /* ───── IndexedDB layer (graceful in-memory fallback) ───── */
  idb(){
    if(this._db||this._dbFail) return Promise.resolve(this._db);
    return new Promise(res=>{
      try{
        const rq=indexedDB.open('ssa-ephem-cache',1);
        rq.onupgradeneeded=()=>rq.result.createObjectStore('vectors');
        rq.onsuccess=()=>{this._db=rq.result;res(this._db);};
        rq.onerror=()=>{this._dbFail=true;res(null);};
      }catch(e){this._dbFail=true;res(null);}
    });
  },
  async idbGet(key){
    const db=await this.idb();if(!db)return null;
    return new Promise(res=>{
      try{
        const rq=db.transaction('vectors').objectStore('vectors').get(key);
        rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null);
      }catch(e){res(null);}
    });
  },
  async idbPut(key,val){
    const db=await this.idb();if(!db)return;
    try{db.transaction('vectors','readwrite').objectStore('vectors').put(val,key);}catch(e){}
  },

  async fetchText(url){
    const urls=[url,'https://corsproxy.io/?'+encodeURIComponent(url),
      'https://api.allorigins.win/raw?url='+encodeURIComponent(url)];
    for(const u of urls){
      try{
        const r=await fetch(u,{signal:fetchTimeoutSignal(20000)});
        if(!r.ok) continue;
        const t=await r.text();
        if(t.length>50) return t;
      }catch(e){}
    }
    return null;
  },

  /* major solar-system bodies are NOT in the Small-Body Database — resolve
     them locally against the Horizons major-body command table first */
  MAJORS:[
    {n:'Sun',c:'10'},{n:'Moon (Luna)',c:'301'},{n:'Mercury',c:'199'},{n:'Venus',c:'299'},
    {n:'Mars',c:'499'},{n:'Jupiter',c:'599'},{n:'Saturn',c:'699'},{n:'Uranus',c:'799'},
    {n:'Neptune',c:'899'},{n:'Pluto',c:'999'},
    {n:'Phobos (Mars I)',c:'401'},{n:'Deimos (Mars II)',c:'402'},
    {n:'Io (Jupiter I)',c:'501'},{n:'Europa (Jupiter II)',c:'502'},
    {n:'Ganymede (Jupiter III)',c:'503'},{n:'Callisto (Jupiter IV)',c:'504'},
    {n:'Mimas (Saturn I)',c:'601'},{n:'Enceladus (Saturn II)',c:'602'},
    {n:'Titan (Saturn VI)',c:'606'},{n:'Iapetus (Saturn VIII)',c:'608'},
    {n:'Titania (Uranus III)',c:'703'},{n:'Triton (Neptune I)',c:'801'},
    {n:'Charon (Pluto I)',c:'901'}
  ],
  majorLookup(q){
    const s=q.toLowerCase().replace(/[^a-z0-9 ]/g,'');
    if(s.length<2) return null;
    const hits=this.MAJORS.filter(m=>m.n.toLowerCase().includes(s));
    if(hits.length===1) return{ok:true,cmd:hits[0].c,name:hits[0].n,kind:'major',orbitClass:'MAJOR BODY'};
    if(hits.length>1) return{multi:hits.slice(0,8).map(m=>({cmd:m.c,name:m.n}))};
    return null;
  },

  /* ───── Dynamic fuzzy search ─────
     pipeline: local major-body table → JPL SBDB Lookup API (small bodies)
     Returns {ok:true,cmd,name} | {multi:[{cmd,name}…]} | {none:true,q} */
  async sbdbLookup(q){
    const mj=this.majorLookup(q);
    if(mj) return mj;
    const url='https://ssd-api.jpl.nasa.gov/sbdb.api?sstr='+encodeURIComponent(q);
    const txt=await this.fetchText(url);
    if(!txt) return{err:true,q};
    let j;try{j=JSON.parse(txt);}catch(e){return{err:true,q};}
    if(j.object){
      const des=j.object.des||j.object.spkid;
      const cmd=j.object.kind&amp;&amp;j.object.kind[0]==='c'?'DES='+des+';CAP':des+';';
      return{ok:true,cmd,name:(j.object.fullname||des).trim(),
             kind:j.object.kind,orbitClass:j.object.orbit_class?j.object.orbit_class.name:null};
    }
    if(j.code==='300'&amp;&amp;j.list&amp;&amp;j.list.length){
      return{multi:j.list.slice(0,8).map(o=>({cmd:o.pdes?o.pdes+';':'DES='+o.name+';CAP',name:o.name||o.pdes}))};
    }
    return{none:true,q};
  },

  /* ───── state-vector packets (heliocentric ecliptic J2000, AU &amp; AU/d) ───── */
  async getVectors(cmd,spanDays=16,stepH=6){
    const day=new Date().toISOString().slice(0,10);
    const key=cmd+'|'+day+'|'+spanDays+'|'+stepH;
    if(this.mem[key]) return this.mem[key];
    const stored=await this.idbGet(key);
    if(stored){this.mem[key]=stored;return stored;}
    const t0=new Date(Date.now()-2*86400000);
    const t1=new Date(t0.getTime()+spanDays*86400000);
    const fmt=d=>&quot;'&quot;+d.toISOString().slice(0,16).replace('T',' ')+&quot;'&quot;;
    const p=new URLSearchParams({
      format:'text',COMMAND:&quot;'&quot;+cmd+&quot;'&quot;,OBJ_DATA:'NO',MAKE_EPHEM:'YES',
      EPHEM_TYPE:'VECTORS',CENTER:&quot;'500@10'&quot;,REF_PLANE:'ECLIPTIC',
      START_TIME:fmt(t0),STOP_TIME:fmt(t1),STEP_SIZE:&quot;'&quot;+stepH+&quot; h'&quot;,
      VEC_TABLE:'2',OUT_UNITS:'AU-D',CSV_FORMAT:'YES',VEC_LABELS:'NO'});
    const txt=await this.fetchText('https://ssd.jpl.nasa.gov/api/horizons.api?'+p.toString());
    if(!txt) return null;
    const pack=this.parseVectors(txt);
    if(pack){this.mem[key]=pack;this.idbPut(key,pack);}
    return pack;
  },
  /* CSV rows: JDTDB, Cal, X, Y, Z, VX, VY, VZ */
  parseVectors(txt){
    const i0=txt.indexOf('$$SOE'),i1=txt.indexOf('$$EOE');
    if(i0<0||i1<0) return null;
    const jd=[],P=[],V=[];
    txt.slice(i0+5,i1).split('\n').forEach(l=>{
      const c=l.trim().split(',').map(s=>s.trim());
      if(c.length<8) return;
      const j=parseFloat(c[0]);if(!isFinite(j)) return;
      jd.push(j);
      P.push([+c[2],+c[3],+c[4]]);
      V.push([+c[5],+c[6],+c[7]]);
    });
    if(jd.length<2) return null;
    return{jd0:jd[0],jd1:jd[jd.length-1],h:jd[1]-jd[0],jd,P,V};
  },

  /* ───── cubic Hermite interpolation over a vector packet ─────
     p(s)=h00·p0+h10·h·v0+h01·p1+h11·h·v1 — C¹ continuous because the
     segment endpoints share exact JPL velocities. */
  posAt(pack,jd){
    if(!pack||jd<pack.jd0||jd>pack.jd1) return null;
    let i=Math.min(pack.jd.length-2,Math.max(0,Math.floor((jd-pack.jd0)/pack.h)));
    while(i>0&amp;&amp;jd<pack.jd[i]) i--;
    while(i<pack.jd.length-2&amp;&amp;jd>pack.jd[i+1]) i++;
    const h=pack.jd[i+1]-pack.jd[i];
    const s=(jd-pack.jd[i])/h,s2=s*s,s3=s2*s;
    const h00=2*s3-3*s2+1,h10=s3-2*s2+s,h01=-2*s3+3*s2,h11=s3-s2;
    const p0=pack.P[i],p1=pack.P[i+1],v0=pack.V[i],v1=pack.V[i+1];
    const out=[0,0,0];
    for(let k=0;k<3;k++) out[k]=h00*p0[k]+h10*h*v0[k]+h01*p1[k]+h11*h*v1[k];
    return out;
  },
  velAt(pack,jd){ /* AU/day, analytic Hermite derivative */
    if(!pack||jd<pack.jd0||jd>pack.jd1) return null;
    let i=Math.min(pack.jd.length-2,Math.max(0,Math.floor((jd-pack.jd0)/pack.h)));
    while(i>0&amp;&amp;jd<pack.jd[i]) i--;
    while(i<pack.jd.length-2&amp;&amp;jd>pack.jd[i+1]) i++;
    const h=pack.jd[i+1]-pack.jd[i];
    const s=(jd-pack.jd[i])/h;
    const d00=(6*s*s-6*s)/h,d10=(3*s*s-4*s+1),d01=(-6*s*s+6*s)/h,d11=(3*s*s-2*s);
    const p0=pack.P[i],p1=pack.P[i+1],v0=pack.V[i],v1=pack.V[i+1];
    const out=[0,0,0];
    for(let k=0;k<3;k++) out[k]=d00*p0[k]+d10*v0[k]+d01*p1[k]+d11*v1[k];
    return out;
  }
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  MODULE · FrameBridge — unified scene transformation layer        ║
   ║  Maps both tracking classes into ONE world space (heliocentric    ║
   ║  ecliptic J2000, AU):                                             ║
   ║    deep-space:  already heliocentric ecliptic       → identity    ║
   ║    satellites:  ECI equatorial km → rotate by −ε about X into     ║
   ║                 ecliptic, ÷AU, + Earth's heliocentric position    ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const BRIDGE={
  EPS:23.439291*Math.PI/180,
  eqToEcl(v){ /* equatorial → ecliptic (rotate about X by −ε) */
    const ce=Math.cos(this.EPS),se=Math.sin(this.EPS);
    return[v[0],ce*v[1]+se*v[2],-se*v[1]+ce*v[2]];
  },
  eclToEq(v){
    const ce=Math.cos(this.EPS),se=Math.sin(this.EPS);
    return[v[0],ce*v[1]-se*v[2],se*v[1]+ce*v[2]];
  },
  earthHelio(jd){return SS.planetPos('Earth',jd);},          /* AU, ecliptic */
  eciKmToHelioAU(rECI,jd){
    const e=this.eqToEcl(rECI);
    const E=this.earthHelio(jd);
    return[E[0]+e[0]/AU_KM,E[1]+e[1]/AU_KM,E[2]+e[2]/AU_KM];
  },
  helioAUToEarthKm(rHel,jd){ /* heliocentric AU → geocentric equatorial km */
    const E=this.earthHelio(jd);
    const g=[(rHel[0]-E[0])*AU_KM,(rHel[1]-E[1])*AU_KM,(rHel[2]-E[2])*AU_KM];
    return this.eclToEq(g);
  }
};

  presetEls(cmd){
    const p=this.PRESET_ELS[cmd];
    if(!p) return null;
    const n=0.9856076686/Math.pow(p.a,1.5); /* deg/day */
    return{a:p.a,e:p.e,i:p.i*D2R,Om:p.Om*D2R,w:p.w*D2R,M0:p.M0,n,epoch:p.epoch};
  },

  solveKepler(M,e){ /* bisection-safeguarded Newton — f(E)=E−e·sinE−M is monotone, so this always converges, even e→0.99 */
    M=((M%(2*Math.PI))+3*Math.PI)%(2*Math.PI)-Math.PI;
    let lo=-Math.PI,hi=Math.PI,E=e<0.8?M:Math.PI*(M>=0?1:-1)*0.999;
    for(let i=0;i<64;i++){
      const f=E-e*Math.sin(E)-M;
      if(Math.abs(f)<1e-12) break;
      if(f>0) hi=E; else lo=E;
      let En=E-f/(1-e*Math.cos(E));
      if(!(En>lo&amp;&amp;En<hi)) En=(lo+hi)/2;
      E=En;
    }
    return E;
  },
  /* heliocentric ecliptic-J2000 position (AU) from element set at jd */
  posFromEls(a,e,I,om,Om,M){ /* angles rad */
    const E=this.solveKepler(M,e);
    const xp=a*(Math.cos(E)-e), yp=a*Math.sqrt(1-e*e)*Math.sin(E);
    const co=Math.cos(om),so=Math.sin(om),cO=Math.cos(Om),sO=Math.sin(Om),cI=Math.cos(I),sI=Math.sin(I);
    return[
      (co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp,
      (co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp,
      (so*sI)*xp+(co*sI)*yp];
  },
  planetEls(name,jd){
    const T=(jd-2451545.0)/36525;
    const[e0,e1]=this.EL[name];
    const a=e0[0]+e1[0]*T, e=e0[1]+e1[1]*T, I=(e0[2]+e1[2]*T)*D2R;
    const L=e0[3]+e1[3]*T, vp=e0[4]+e1[4]*T, Om0=e0[5]+e1[5]*T;
    const om=(vp-Om0)*D2R, Om=Om0*D2R;
    let M=((L-vp)%360+540)%360-180;
    return{a,e,I,om,Om,M:M*D2R};
  },
  planetPos(name,jd){
    const k=this.planetEls(name,jd);
    return this.posFromEls(k.a,k.e,k.I,k.om,k.Om,k.M);
  },
  /* display transform: ecliptic AU → scene units (compact compresses radius) */
  disp(v){
    const r=Math.hypot(v[0],v[1],v[2]);
    if(r<1e-9) return new THREE.Vector3(0,0,0);
    const s=(this.trueScale?28*r:this.K*Math.pow(r,this.pExp))/r;
    return new THREE.Vector3(v[0]*s,v[2]*s,-v[1]*s); /* ecliptic plane horizontal */
  },

  /* ── asteroid main belt + Kuiper belt: round-sprite point clouds with

  buildBelts(){
