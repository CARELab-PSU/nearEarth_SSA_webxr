  /* ═════ 6 · REGULATORY &amp; OSINT LAUNCH PRE-FILTER ═════
     Illustrative TFR / hazard-zone geometry derived from the pad position and
     the mission's target orbit (live FAA NOTAM feeds require authenticated
     access, so geometry is representative — labeled as such on the map). */
  pickLaunch(i){
    this._selLaunch=this._selLaunch===i?-1:i;
    this.renderLaunches();
    const wrap=document.getElementById('d-tfr-wrap');
    if(this._selLaunch<0){wrap.style.display='none';return;}
    const L=this._launches[i];
    if(L.lat===null||isNaN(L.lat)){wrap.style.display='none';return;}
    wrap.style.display='block';
    document.getElementById('d-tfr-title').textContent=
      L.name.toUpperCase()+' — PRE-LAUNCH AIRSPACE PICTURE';
    const draw=()=>this.drawTFR(L);
    if(typeof worldMapImg!=='undefined'&amp;&amp;worldMapImg) draw();
    else loadWorldMap(draw);
  },
  launchAz(L){ /* representative launch azimuth from the target orbit class */
    const o=(L.orbit||'').toUpperCase();
    if(/SSO|POLAR/.test(o)) return L.lat>0?188:8;     /* southbound from N-hemisphere */
    if(/GTO|GEO/.test(o)) return 93;                  /* near-due-east */
    if(/ISS|LEO/.test(o)) return L.lat>20?45:90;      /* NE corridor (51.6° from the Cape) */
    return 90;
  },
  drawTFR(L){
    const cv=document.getElementById('d-tfr-map');
    cv.width=cv.clientWidth*2;cv.height=Math.round(cv.width*0.56);
    const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
    /* zoomed crop of the equirectangular basemap: ±9° lon · ±5° lat around the pad */
    const dLon=9,dLat=5.04;
    const lon0=L.lon-dLon,lat0=L.lat+dLat;
    const xy=(la,lo)=>({x:(lo-lon0)/(2*dLon)*W,y:(lat0-la)/(2*dLat)*H});
    if(typeof worldMapImg!=='undefined'&amp;&amp;worldMapImg){
      const iw=worldMapImg.width,ih=worldMapImg.height;
      const sx=(lon0+180)/360*iw, sy=(90-lat0)/180*ih;
      ctx.drawImage(worldMapImg,sx,sy,(2*dLon)/360*iw,(2*dLat)/180*ih,0,0,W,H);
      ctx.fillStyle='rgba(2,8,14,.45)';ctx.fillRect(0,0,W,H);
    } else {ctx.fillStyle='#06101a';ctx.fillRect(0,0,W,H);}
    const pad=xy(L.lat,L.lon);
    const kmPerPxX=2*dLon*111.32*Math.cos(L.lat*D2R)/W;
    const az=this.launchAz(L)*D2R;
    /* hazard corridor: widening downrange polygon along the launch azimuth */
    const downrange=(km,off)=>{ /* km along az, off km cross-track */
      const dN=km*Math.cos(az)-off*Math.sin(az), dE=km*Math.sin(az)+off*Math.cos(az);
      return xy(L.lat+dN/111.32, L.lon+dE/(111.32*Math.cos(L.lat*D2R)));
    };
    ctx.beginPath();
    const cor=[[0,3],[120,18],[420,60],[820,110],[820,-110],[420,-60],[120,-18],[0,-3]];
    cor.forEach((c,k)=>{const p=downrange(c[0],c[1]);k?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});
    ctx.closePath();
    ctx.fillStyle='rgba(255,85,102,.13)';ctx.fill();
    ctx.strokeStyle='rgba(255,85,102,.75)';ctx.lineWidth=2;ctx.setLineDash([8,5]);ctx.stroke();ctx.setLineDash([]);
    /* stage-1 + fairing drop boxes downrange */
    [[300,40,'STAGE 1 / BOOSTER DZ'],[640,55,'FAIRING DZ']].forEach(z=>{
      const c=downrange(z[0],0),r=z[1]/kmPerPxX;
      ctx.strokeStyle='rgba(255,170,60,.85)';ctx.lineWidth=2;
      ctx.strokeRect(c.x-r,c.y-r*0.6,r*2,r*1.2);
      ctx.fillStyle='rgba(255,190,90,.95)';ctx.font='bold 13px IBM Plex Mono';
      ctx.fillText(z[2],c.x-r,c.y-r*0.6-6);
    });
    /* concentric TFR rings around the pad: 5 / 12 / 30 NM */
    [[9.26,'5 NM'],[22.2,'12 NM'],[55.6,'30 NM TFR']].forEach(rr=>{
      ctx.strokeStyle='rgba(0,229,255,.7)';ctx.lineWidth=1.6;
      ctx.beginPath();ctx.arc(pad.x,pad.y,rr[0]/kmPerPxX,0,2*Math.PI);ctx.stroke();
      ctx.fillStyle='rgba(0,229,255,.85)';ctx.font='12px IBM Plex Mono';
      ctx.fillText(rr[1],pad.x+rr[0]/kmPerPxX*0.71+4,pad.y-rr[0]/kmPerPxX*0.71);
    });
    /* pad marker + azimuth arrow */
    ctx.fillStyle='#ff5566';
    ctx.beginPath();ctx.moveTo(pad.x,pad.y-10);ctx.lineTo(pad.x+7,pad.y);ctx.lineTo(pad.x,pad.y+10);ctx.lineTo(pad.x-7,pad.y);ctx.closePath();ctx.fill();
    const tip=downrange(150,0);
    ctx.strokeStyle='#00ff9d';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(pad.x,pad.y);ctx.lineTo(tip.x,tip.y);ctx.stroke();
    ctx.fillStyle='#00ff9d';ctx.font='bold 13px IBM Plex Mono';
    ctx.fillText('AZ '+this.launchAz(L).toFixed(0)+'° ('+(L.orbit||'LEO')+')',tip.x+6,tip.y);
    ctx.fillStyle='#ffb0ba';ctx.font='bold 13px IBM Plex Mono';
    ctx.fillText('PAD · '+L.lat.toFixed(3)+'°, '+L.lon.toFixed(3)+'°',pad.x+12,pad.y+22);
    document.getElementById('d-tfr-note').textContent=
      'ILLUSTRATIVE TFR + HAZARD GEOMETRY for the planned '+(L.orbit||'LEO')+' azimuth — live FAA NOTAM polygons require authenticated API access. Safety zones map directly to the launch azimuth and staging points before the vehicle ever leaves the pad.';
  }
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  MODULE · ConjunctionWatch — close-approach (CA) screening        ║
   ║  · SOCRATES CDM feed (CelesTrak) — top projected approaches       ║
   ║  · per-pair ECI scene: both orbits, TCA geometry, miss vector     ║
   ║  · conjunction sub-point on the high-fidelity Earth               ║
   ║  · osculating SMA history a(t)=1/(2/r − v²/μ) for both objects    ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const CA={
  inited:false,three:null,rows:[],sel:-1,sort:'range',
  t1:null,t2:null,_tleCache:{},_src:'—',

  init(){
    if(this.inited) return;
    this.inited=true;
    if(!HEADLESS) this.three=initThree3D('ca-canvas-wrap',{axes:false,rad:RE_KM*5.4});
    this.refresh();
    setInterval(()=>this.refresh(),60*60*1000);   /* hourly feed refresh */
  },

  /* ── SOCRATES feed: try CSV endpoints, then the HTML report, then sample ── */
  async refresh(){
    const st=document.getElementById('ca-feed-state');
    st.textContent='FETCHING SOCRATES…';
    const bases=[
      'https://celestrak.org/SOCRATES/sort-minRange.csv',
      'https://celestrak.org/SOCRATES/sort-maxProb.csv',
      'https://celestrak.org/SOCRATES/socrates.csv',
      'https://celestrak.org/SOCRATES/'
    ];
    let rows=null,src=null;
    for(const base of bases){
      const urls=[base,'https://corsproxy.io/?'+encodeURIComponent(base),
                  'https://api.allorigins.win/raw?url='+encodeURIComponent(base)];
      for(const u of urls){
        try{
          const r=await fetch(u,{signal:fetchTimeoutSignal(20000)});
          if(!r.ok) continue;
          const txt=await r.text();
          rows=this.parseSocrates(txt);
          if(rows&amp;&amp;rows.length){src=base.endsWith('/')?'SOCRATES HTML REPORT':'SOCRATES CSV';break;}
        }catch(e){}
      }
      if(rows&amp;&amp;rows.length) break;
    }
    if(!rows||!rows.length){
      rows=this.sampleRows();src='⚠ FEED UNREACHABLE — EMBEDDED SAMPLE';
    }
    this._src=src;
    this.rows=rows;
    this.renderList();
    st.textContent=src+' · '+rows.length+' PAIRS';
    if(this.sel<0&amp;&amp;rows.length) this.select(0);
  },

  /* tolerant parser: SOCRATES CSV (header keyed) or the HTML report table */
  parseSocrates(txt){
    const out=[];
    if(/<html|<table/i.test(txt)){
      /* HTML report: rows carry NORAD ids, names, TCA, range, speed, prob */
      const trs=txt.split(/<tr[^>]*>/i).slice(1);
      for(const tr of trs){
        const cells=[...tr.matchAll(/<td[^>]*>([\s\S]*?)<\/td>/gi)].map(m=>m[1].replace(/<[^>]+>/g,'').trim());
        if(cells.length<8) continue;
        const nums=cells.map(c=>parseFloat(c));
        /* heuristics: find two 4-6 digit ints (NORAD ids) and a date cell */
        const idIdx=cells.map((c,i)=>/^\d{4,6}$/.test(c)?i:-1).filter(i=>i>=0);
        const tcaIdx=cells.findIndex(c=>/\d{4}.*\d{2}:\d{2}/.test(c));
        if(idIdx.length>=2&amp;&amp;tcaIdx>=0){
          const rng=nums.find((v,i)=>i>tcaIdx&amp;&amp;isFinite(v)&amp;&amp;v<50);
          const spd=nums.find((v,i)=>i>tcaIdx&amp;&amp;isFinite(v)&amp;&amp;v>0.05&amp;&amp;v<20);
          out.push({id1:cells[idIdx[0]],n1:cells[idIdx[0]+1]||'OBJ '+cells[idIdx[0]],
                    id2:cells[idIdx[1]],n2:cells[idIdx[1]+1]||'OBJ '+cells[idIdx[1]],
                    tca:new Date(cells[tcaIdx].replace(/\s+/,'T')+'Z'),
                    rangeKm:rng??0,relV:spd??0,prob:null});
        }
        if(out.length>=20) break;
      }
      return out.filter(r=>r.tca&amp;&amp;!isNaN(r.tca));
    }
    /* CSV with a header row */
    const lines=txt.split(/\r?\n/).filter(l=>l.trim());
    const hi=lines.findIndex(l=>/TCA/i.test(l)&amp;&amp;/,/.test(l));
    if(hi<0) return null;
    const H=lines[hi].split(',').map(s=>s.trim().toUpperCase());
    const col=names=>{for(const n of names){const i=H.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
    const c={id1:col(['NORAD_CAT_ID_1','SAT1_ID','OBJECT_1_ID']),n1:col(['OBJECT_NAME_1','SAT1_NAME']),
             id2:col(['NORAD_CAT_ID_2','SAT2_ID','OBJECT_2_ID']),n2:col(['OBJECT_NAME_2','SAT2_NAME']),
             tca:col(['TCA']),rng:col(['TCA_RANGE','MIN_RNG','RANGE']),
             v:col(['RELATIVE_SPEED','REL_SPEED','RELATIVE_VELOCITY']),p:col(['MAX_PROB','PC','PROBABILITY'])};
    if(c.id1<0||c.id2<0||c.tca<0) return null;
    for(let i=hi+1;i<lines.length&amp;&amp;out.length<25;i++){
      const f=lines[i].split(',').map(s=>s.trim());
      if(f.length<H.length-1) continue;
      const tca=new Date(f[c.tca].replace(' ','T')+(f[c.tca].endsWith('Z')?'':'Z'));
      if(isNaN(tca)) continue;
      out.push({id1:f[c.id1],n1:c.n1>=0?f[c.n1]:'OBJ '+f[c.id1],
                id2:f[c.id2],n2:c.n2>=0?f[c.n2]:'OBJ '+f[c.id2],
                tca,rangeKm:c.rng>=0?parseFloat(f[c.rng]):0,
                relV:c.v>=0?parseFloat(f[c.v]):0,
                prob:c.p>=0?parseFloat(f[c.p]):null});
    }
    return out;
  },
  sampleRows(){
    const h=3600000,now=Date.now();
    return[
      {id1:'25544',n1:'ISS (ZARYA)',id2:'48275',n2:'CZ-5B R/B',tca:new Date(now+9*h),rangeKm:1.42,relV:11.2,prob:2.1e-4},
      {id1:'43013',n1:'NOAA 20',id2:'29275',n2:'FENGYUN 1C DEB',tca:new Date(now+14*h),rangeKm:0.31,relV:14.6,prob:8.4e-4},
      {id1:'20580',n1:'HST',id2:'39084',n2:'COSMOS 2251 DEB',tca:new Date(now+22*h),rangeKm:0.88,relV:9.8,prob:1.2e-4},
      {id1:'48274',n1:'TIANHE',id2:'31114',n2:'IRIDIUM 33 DEB',tca:new Date(now+31*h),rangeKm:2.6,relV:12.4,prob:4.0e-5},
      {id1:'28654',n1:'NOAA 18',id2:'34454',n2:'SL-16 R/B',tca:new Date(now+41*h),rangeKm:0.54,relV:13.1,prob:5.5e-4}
    ];
  },

  setSort(s,btn){
    this.sort=s;
    document.querySelectorAll('.ca-sort').forEach(b=>b.classList.remove('on'));
    if(btn) btn.classList.add('on');
    this.renderList();
  },
  renderList(){
    const host=document.getElementById('ca-list');if(!host)return;
    const rows=[...this.rows];
    if(this.sort==='range') rows.sort((a,b)=>a.rangeKm-b.rangeKm);
    else if(this.sort==='tca') rows.sort((a,b)=>a.tca-b.tca);
    else rows.sort((a,b)=>(b.prob||0)-(a.prob||0));
    this._view=rows;
    host.innerHTML=rows.map((r,i)=>{
      const dt=(r.tca.getTime()-EPOCH.ms())/1000;
      return '<div class=&quot;ca-row'+(i===this.sel?' sel':'')+'&quot; onclick=&quot;CA.select('+i+')&quot;>'+
        '<div class=&quot;car-top&quot;><span class=&quot;car-pair&quot;>'+r.n1.slice(0,15)+' ⚠ '+r.n2.slice(0,15)+'</span>'+
        '<span class=&quot;car-rng&quot;>'+(r.rangeKm<1?(r.rangeKm*1000).toFixed(0)+' m':r.rangeKm.toFixed(2)+' km')+'</span></div>'+
        '<div class=&quot;car-sub&quot;>'+r.id1+' × '+r.id2+' · TCA '+(dt>0?'T−'+fmtHMS(dt):'T+'+fmtHMS(-dt))+
        ' · '+r.relV.toFixed(1)+' km/s'+(r.prob?' · Pc '+r.prob.toExponential(1):'')+'</div></div>';
    }).join('');
  },

  async fetchTLE(id){
    if(this._tleCache[id]) return this._tleCache[id];
    /* a NORAD id may already be in a loaded catalog bucket */
    if(typeof CAT!=='undefined'&amp;&amp;CAT.sats.length){
      const hit=CAT.sats.find(s=>String(s.tle.satnum)===String(id));
      if(hit){this._tleCache[id]=hit.tle;return hit.tle;}
    }
    const base='https://celestrak.org/NORAD/elements/gp.php?CATNR='+id+'&amp;FORMAT=tle';
    for(const u of [base,'https://corsproxy.io/?'+encodeURIComponent(base),
                    'https://api.allorigins.win/raw?url='+encodeURIComponent(base)]){
      try{
        const r=await fetch(u,{signal:fetchTimeoutSignal(15000)});
        if(!r.ok) continue;
        const t=await r.text();
        if(t.includes('1 ')&amp;&amp;t.includes('2 ')){
          const p=parseCatalog(t).filter(x=>x.satrec);
          if(p.length){this._tleCache[id]=p[0];return p[0];}
        }
      }catch(e){}
    }
    return null;
  },

  async select(i){
    this.sel=i;this.renderList();
    const r=this._view[i];if(!r)return;
    document.getElementById('ca-pair-title').textContent=r.n1+'  ×  '+r.n2;
    document.getElementById('ca-detail-state').textContent='FETCHING ELEMENT SETS…';
    const[t1,t2]=await Promise.all([this.fetchTLE(r.id1),this.fetchTLE(r.id2)]);
    this.t1=t1;this.t2=t2;this.cur=r;
    if(!t1||!t2){
      document.getElementById('ca-detail-state').textContent='⚠ TLE FETCH FAILED FOR '+(!t1?r.id1:r.id2)+' — GEOMETRY UNAVAILABLE';
      return;
    }
    document.getElementById('ca-detail-state').textContent='SGP4 ELEMENT SETS LOADED · EPOCHS '+fmtDateUTC(t1.epoch).slice(0,11)+' / '+fmtDateUTC(t2.epoch).slice(0,11);
    if(this.three){ this.buildScene(); this.drawSMA(); }
    this.renderDetail();
  },

  eciAt(tle,d){
    try{const pv=satellite.propagate(tle.satrec,d);
      if(pv&amp;&amp;pv.position&amp;&amp;isFinite(pv.position.x))
        return{r:[pv.position.x,pv.position.y,pv.position.z],v:[pv.velocity.x,pv.velocity.y,pv.velocity.z]};
    }catch(e){}
    return null;
  },

  buildScene(){
    const T=this.three,r=this.cur;
    /* clear previous pair artifacts */
    ['caOrb1','caOrb2','caMk1','caMk2','caMiss','caTCA','caSub','caSubLine'].forEach(n=>{
      const o=T.scene.getObjectByName(n);if(o)T.scene.remove(o);
    });
    const mkOrbit=(tle,color,name)=>{
      const P=tle.T_s,N=180,pts=[];
      for(let k=0;k<=N;k++){
        const d=new Date(r.tca.getTime()+((k/N)-0.5)*P*1000);
        const s=this.eciAt(tle,d);
        if(s) pts.push(new THREE.Vector3(s.r[0],s.r[2],-s.r[1]));
      }
      if(pts.length<2) return;
      const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color,transparent:true,opacity:.9}));
      line.name=name;T.scene.add(line);
    };
    mkOrbit(this.t1,0x00e5ff,'caOrb1');
    mkOrbit(this.t2,0xffd24a,'caOrb2');
    const s1=this.eciAt(this.t1,r.tca),s2=this.eciAt(this.t2,r.tca);
    if(s1&amp;&amp;s2){
      const p1=new THREE.Vector3(s1.r[0],s1.r[2],-s1.r[1]);
      const p2=new THREE.Vector3(s2.r[0],s2.r[2],-s2.r[1]);
      const mk=(p,c,n)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(130,16,16),
        new THREE.MeshBasicMaterial({color:c}));m.position.copy(p);m.name=n;T.scene.add(m);};
      mk(p1,0x00e5ff,'caMk1');mk(p2,0xffd24a,'caMk2');
      const miss=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1,p2]),
        new THREE.LineBasicMaterial({color:0xff5566}));
      miss.name='caMiss';T.scene.add(miss);
      const mid=p1.clone().add(p2).multiplyScalar(0.5);
      const tcaMk=new THREE.Mesh(new THREE.TorusGeometry(420,40,10,40),
        new THREE.MeshBasicMaterial({color:0xff5566,transparent:true,opacity:.65}));
      tcaMk.position.copy(mid);tcaMk.lookAt(0,0,0);tcaMk.name='caTCA';T.scene.add(tcaMk);
      /* conjunction SUB-POINT: rotate the ECI midpoint into ECEF at TCA → geodetic */
      const gm=gmst_from_jd(julianDate(r.tca)),ct=Math.cos(gm),st=Math.sin(gm);
      const mE=[ct*(s1.r[0]+s2.r[0])/2+st*(s1.r[1]+s2.r[1])/2,
               -st*(s1.r[0]+s2.r[0])/2+ct*(s1.r[1]+s2.r[1])/2,(s1.r[2]+s2.r[2])/2];
      const lon=((Math.atan2(mE[1],mE[0])*R2D+540)%360)-180;
      const lat=Math.atan2(mE[2],Math.hypot(mE[0],mE[1]))*R2D;
      this.subLL={lat,lon};
      /* the sub-point lives on the rotating earthMesh so it tracks GMST */
      const la=lat*D2R,lo=lon*D2R;
      const sp=new THREE.Mesh(new THREE.SphereGeometry(110,12,12),
        new THREE.MeshBasicMaterial({color:0xff5fd2}));
      sp.position.set(RE_KM*1.01*Math.cos(la)*Math.cos(lo),RE_KM*1.01*Math.sin(la),-RE_KM*1.01*Math.cos(la)*Math.sin(lo));
      sp.name='caSub';
      if(T.earthMesh) T.earthMesh.add(sp); else T.scene.add(sp);
      const sl=new THREE.Line(new THREE.BufferGeometry().setFromPoints([sp.position.clone().multiplyScalar(1.0),sp.position.clone().normalize().multiplyScalar(mid.length())]),
        new THREE.LineBasicMaterial({color:0xff5fd2,transparent:true,opacity:.3}));
      sl.name='caSubLine';
      if(T.earthMesh) T.earthMesh.add(sl); else T.scene.add(sl);
    }
  },

  /* osculating semi-major axis a(t)=1/(2/r − v²/μ) over ±12 h for both objects */
  drawSMA(){
    const c=document.getElementById('ca-sma');if(!c)return;
    c.width=c.clientWidth*2;c.height=c.clientHeight*2;
    const ctx=c.getContext('2d'),W=c.width,H=c.height;
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='rgba(2,8,14,.6)';ctx.fillRect(0,0,W,H);
    const series=[[this.t1,'#00e5ff'],[this.t2,'#ffd24a']].map(([tle,col])=>{
      const pts=[];
      for(let k=0;k<=96;k++){
        const d=new Date(this.cur.tca.getTime()+((k/96)-0.5)*24*3600*1000);
        const s=this.eciAt(tle,d);
        if(!s) continue;
        const rm=Math.hypot(...s.r),vm2=s.v[0]**2+s.v[1]**2+s.v[2]**2;
        pts.push({k,a:1/(2/rm-vm2/MU_E)});
      }
      return{pts,col,tle};
    });
    const all=series.flatMap(s=>s.pts.map(p=>p.a));
    if(!all.length) return;
    let aMin=Math.min(...all),aMax=Math.max(...all);
    const pad=(aMax-aMin)*0.15+0.5;aMin-=pad;aMax+=pad;
    /* TCA line */
    ctx.strokeStyle='rgba(255,85,102,.8)';ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(255,85,102,.9)';ctx.font='13px IBM Plex Mono';ctx.fillText('TCA',W/2+5,14);
    series.forEach(s=>{
      ctx.beginPath();
      s.pts.forEach((p,i)=>{
        const x=p.k/96*W,y=H-(p.a-aMin)/(aMax-aMin)*H;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);
      });
      ctx.strokeStyle=s.col;ctx.lineWidth=2.5;ctx.shadowColor=s.col;ctx.shadowBlur=5;ctx.stroke();ctx.shadowBlur=0;
      const last=s.pts[s.pts.length-1];
      ctx.fillStyle=s.col;ctx.font='13px IBM Plex Mono';
      ctx.fillText(s.tle.name.slice(0,14)+' a≈'+last.a.toFixed(1)+' km',8,s.col==='#00e5ff'?16:32);
    });
    ctx.fillStyle='rgba(140,165,185,.85)';ctx.font='12px IBM Plex Mono';
    ctx.fillText('OSCULATING SMA · TCA ± 12 H',W-220,H-8);
  },

  renderDetail(){
    const r=this.cur,el=document.getElementById('ca-info');
    const row=(k,v)=>'<div class=&quot;ssi-k&quot;>'+k+'</div><div class=&quot;ssi-v&quot;>'+v+'</div>';
    el.innerHTML='<div class=&quot;ssi-name&quot; style=&quot;font-size:11px;&quot;>CONJUNCTION GEOMETRY</div>'+
      '<div class=&quot;ssi-grid&quot;>'+
      row('OBJECTS','<span style=&quot;color:#00e5ff&quot;>'+r.n1+'</span> ('+r.id1+')<br/><span style=&quot;color:#ffd24a&quot;>'+r.n2+'</span> ('+r.id2+')')+
      row('TCA',fmtDateUTC(r.tca)+'<span class=&quot;ssi-sub&quot;>'+fmtLocalTime(r.tca,SITE.tz)+' LOCAL</span>')+
      row('MISS DIST',(r.rangeKm<1?(r.rangeKm*1000).toFixed(0)+' m':r.rangeKm.toFixed(2)+' km'))+
      row('REL VELOCITY',r.relV.toFixed(2)+' km/s')+
      (r.prob!==null?row('MAX Pc',r.prob.toExponential(2)):'')+
      (this.subLL?row('SUB-POINT',this.subLL.lat.toFixed(2)+'°, '+this.subLL.lon.toFixed(2)+'°'):'')+
      (this.t1?row('SMA / INC ①',this.t1.a.toFixed(0)+' km · '+this.t1.inc.toFixed(1)+'°'):'')+
      (this.t2?row('SMA / INC ②',this.t2.a.toFixed(0)+' km · '+this.t2.inc.toFixed(1)+'°'):'')+
      '</div>';
  },

  frame(nowP,dt){
    const T=this.three;
    T.ctrl.update(dt);
    /* live markers at the global epoch + earth at GMST */
    const d=EPOCH.now();
    if(T.earthMesh) T.earthMesh.rotation.y=gmst_from_jd(julianDate(d));
    if(nowP-(this._sunT||0)>400){this._sunT=nowP;T.setSun(sunECIUnit(d));}
    if(this.t1&amp;&amp;this.t2&amp;&amp;nowP-(this._mkT||0)>120){
      this._mkT=nowP;
      const m1=T.scene.getObjectByName('caMk1'),m2=T.scene.getObjectByName('caMk2');
      const s1=this.eciAt(this.t1,d),s2=this.eciAt(this.t2,d);
      if(m1&amp;&amp;s1) m1.position.set(s1.r[0],s1.r[2],-s1.r[1]);
      if(m2&amp;&amp;s2) m2.position.set(s2.r[0],s2.r[2],-s2.r[1]);
    }
    if(nowP-(this._listT||0)>1000){this._listT=nowP;if(this.rows.length)this.renderList();}
    T.renderer.render(T.scene,T.camera);
  }
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  MODULE · UIStateManager — lab-grade always-on persistence        ║
   ║  Every core parameter caches continuously to localStorage:        ║
   ║  camera viewpoints · active filters · selection arrays · time     ║
   ║  rate/offset · tab + sub-toggle states · sandbox sliders.         ║
   ║  A browser reset re-initializes straight into the prior layout.   ║
   ╚══════════════════════════════════════════════════════════════════╝ */
const STATE={
  KEY:'ssa.v4.state',
  _t:null,_restoring:false,
  dirty(){ /* debounced save — call from any state-changing hook */
    if(this._restoring) return;
    clearTimeout(this._t);
    this._t=setTimeout(()=>this.save(),900);
  },
  camOf(T){return T&amp;&amp;T.ctrl?{t:T.ctrl.tTheta,p:T.ctrl.tPhi,r:T.ctrl.tRad}:null;},
  applyCam(T,c){
    if(!T||!T.ctrl||!c) return;
    T.ctrl.tTheta=T.ctrl.theta=c.t;T.ctrl.tPhi=T.ctrl.phi=c.p;T.ctrl.tRad=T.ctrl.rad=c.r;
  },
  save(){
    /* the headless VR engine shares localStorage with the desktop dashboard on the
       same origin; it must never overwrite the dashboard's layout */
    if(window.__SSA_HEADLESS||document.body.dataset.view==='__vr') return;
    try{
      const s={
        v:5,
        view:document.body.dataset.view||'tracker',
        wxOpen,
        horizonH:HORIZON_S/3600,
        skyVisOnly:SKY_VIS_ONLY,
        catGroups:CAT.GROUPS.filter(g=>g.on).map(g=>g.id),
        catFilter:CAT.filter,
        rate:EPOCH.rate,
        minEl:(document.getElementById('eph-minel')||{}).value,
        ephPlotted:typeof EPH!=='undefined'?EPH.plotted.map(p=>({cmd:p.cmd,name:p.name,g:p.g||'◆'})):[],
        ephActive:typeof EPH!=='undefined'?EPH.active:null,
        sel:SEL.map(s=>s.tle.satnum),
        sandbox:DISC.sandbox,
        cardSel:DISC._cardSel,
        ssScale:typeof SS!=='undefined'?SS.trueScale:undefined,
        cams:{
          eci:this.camOf(typeof eciThree!=='undefined'?eciThree:null),
          ecef:this.camOf(typeof ecefThree!=='undefined'?ecefThree:null),
          cat:this.camOf(CAT.three),
          ca:this.camOf(typeof CA!=='undefined'?CA.three:null),
          ss:this.camOf(typeof SS!=='undefined'?SS.three:null),
          sb:this.camOf(DISC.three)
        }
      };
      localStorage.setItem(this.KEY,JSON.stringify(s));
    }catch(e){}
  },
  load(){
    try{return JSON.parse(localStorage.getItem(this.KEY)||'null');}catch(e){return null;}
  }
};

/* ════ VIEW SWITCHING ════ */
function switchView(v){
  if(!document.getElementById('view-'+v)) return;   /* e.g. a stale &quot;__vr&quot; left in storage by an older VR build */
  document.body.dataset.view=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  try{
  if(v==='catalog'&amp;&amp;!CAT.inited){
    CAT.init();
    CAT.loadChecked();
    const c=STATE._pending&amp;&amp;STATE._pending.cams?STATE._pending.cams.cat:null;
    if(c) STATE.applyCam(CAT.three,c);
  }
  if(v==='eph'){
    if(!EPH._listDone){
      EPH.renderList();
      EPH.renderSiteChip();
      const sel=document.getElementById('eph-site-sel');
      EPH.SITES.forEach((s,i)=>{
        if(i===0) return;
        const o=document.createElement('option');o.value=i;o.textContent=s.n;sel.appendChild(o);
      });
    }
    if(!SS.inited){
      SS.init();
      document.querySelectorAll('.ss-scale-btn').forEach((b,k)=>b.classList.toggle('on',(k===1)===SS.trueScale));
      const c=STATE._pending&amp;&amp;STATE._pending.cams?STATE._pending.cams.ss:null;
      if(c) STATE.applyCam(SS.three,c);
      /* restore plotted deep-space targets sequentially */
      const pl=STATE._pending?STATE._pending.ephPlotted:null;
      if(pl&amp;&amp;pl.length&amp;&amp;!EPH.plotted.length){
        (async()=>{
          for(const p of pl){await EPH.select(p);}
          if(STATE._pending.ephActive) EPH.active=STATE._pending.ephActive;
          EPH.renderList();EPH.drawChart();
        })();
      }
    }
    if(EPH.activePlot()) setTimeout(()=>EPH.drawChart(),40);
  }
  if(v==='ca'&amp;&amp;!CA.inited){
    CA.init();
    const c=STATE._pending&amp;&amp;STATE._pending.cams?STATE._pending.cams.ca:null;
    if(c) STATE.applyCam(CA.three,c);
  }
  if(v==='disc'&amp;&amp;!DISC.inited){
    DISC.init();
    const c=STATE._pending&amp;&amp;STATE._pending.cams?STATE._pending.cams.sb:null;
    if(c) STATE.applyCam(DISC.three,c);
  }
  if(v==='tracker'&amp;&amp;SEL.length&amp;&amp;SEL[0].data){
    /* hidden canvases collapse to 0×0 — repaint static layers on return */
    setTimeout(()=>renderAllSel(),30);
  }
  }catch(err){
    console.error('[switchView:'+v+']',err);
    if(typeof reportRuntimeError==='function') reportRuntimeError('TAB '+v.toUpperCase()+' INIT: '+err.message,err);
  }
  STATE.dirty();
}

/* ════ WX STRIP COLLAPSE ════ */
let wxOpen=false;
function toggleWx(){
  wxOpen=!wxOpen;
  document.getElementById('wx-strip').classList.toggle('open',wxOpen);
  document.getElementById('wx-toggle-btn').textContent=wxOpen?'▾ COLLAPSE':'▸ EXPAND';
  STATE.dirty();
}

/* ════ V4 · BOOT — restore exact prior operating state ════ */
window.addEventListener('load',async()=>{
  try{
  SITE.tzOffsetMin=computeTZOffsetMin(SITE.tz);
  const saved=window.__SSA_HEADLESS?null:STATE.load();
  STATE._pending=saved;
  STATE._restoring=true;

  document.getElementById('load-msg').textContent='Initializing 3-D scenes…';
  setupResizers();
  initThreeScenes();
  EPOCH.bindHUD();
  masterLoop();
  if(!HEADLESS) loadWorldMap(()=>{});
  updateLocalTZLabel();
  setupGTClick();

  /* restore simple toggles before any propagation */
  if(saved){
    if(saved.horizonH) setHorizon(saved.horizonH);
    if(saved.skyVisOnly) toggleSkyVis();
    if(saved.wxOpen) toggleWx();
    if(saved.rate!==undefined&amp;&amp;saved.rate!==1) EPOCH.setRate(saved.rate);
    if(saved.minEl&amp;&amp;document.getElementById('eph-minel')) document.getElementById('eph-minel').value=saved.minEl;
    if(saved.catGroups&amp;&amp;saved.v>=5) CAT.GROUPS.forEach(g=>g.on=saved.catGroups.includes(g.id));
    if(saved.catFilter){CAT.filter=saved.catFilter;
      const fb=document.querySelector('#cat-filter-bar .cfb-btn.on');
      document.querySelectorAll('#cat-filter-bar .cfb-btn').forEach(b=>{
        const lbl={ALL:'ALL OBJECTS',ACTIVE:'ACTIVE SATS',DEBRIS:'DEBRIS ONLY',RB:'ROCKET BODIES'}[saved.catFilter];
        b.classList.toggle('on',b.textContent===lbl);
      });}
    if(saved.sandbox) DISC.sandbox=saved.sandbox;
    if(saved.cardSel!==undefined) DISC._cardSel=saved.cardSel;
    if(saved.ssScale!==undefined&amp;&amp;typeof SS!=='undefined') SS.trueScale=!!saved.ssScale;
    if(saved.cams){
      STATE.applyCam(eciThree,saved.cams.eci);
      STATE.applyCam(ecefThree,saved.cams.ecef);
    }
  }

  document.getElementById('load-msg').textContent='Fetching TLE catalog from Celestrak…';
  let raw=await fetchGroup('stations');
  allSats=raw?parseCatalog(raw):getFallbackSats();
  if(!raw) document.getElementById('sat-list').innerHTML=
    '<div class=&quot;loading-list&quot; style=&quot;color:var(--amber)&quot;>⚠ CORS blocked.<br>Showing embedded samples.</div>';
  populateList(allSats);

  /* restore the ActiveSelection array (NORAD ids), else default to ISS */
  let restored=0;
  if(saved&amp;&amp;saved.sel&amp;&amp;saved.sel.length){
    saved.sel.forEach(sn=>{
      const tle=allSats.find(t=>t.satnum===sn);
      if(tle&amp;&amp;SEL.length<SEL_MAX&amp;&amp;!SEL.find(s=>s.tle.satnum===sn)){
        SEL.push({tle,color:SEL_COLORS[SEL.length]});restored++;
      }
    });
  }
  if(!restored){
    const iss=allSats.find(t=>t.satnum===25544)||allSats[0];
    if(iss) SEL.push({tle:iss,color:SEL_COLORS[0]});
  }
  if(SEL.length){renderAllSel();startTimers();}

  document.getElementById('loading-overlay').classList.add('hide');
  setTimeout(()=>{document.getElementById('loading-overlay').style.display='none';},700);
  if(!HEADLESS) setTimeout(()=>fetchConditions(),1500);

  /* restore active tab last (lazily boots its module) */
  STATE._restoring=false;
  if(saved&amp;&amp;saved.view&amp;&amp;saved.view!=='tracker') switchView(saved.view);

  /* continuous cache: heartbeat save every 10 s + camera deltas */
  setInterval(()=>STATE.save(),10000);
  }catch(err){
    console.error('[boot]',err);
    if(typeof reportRuntimeError==='function') reportRuntimeError('BOOT FAILED: '+err.message,err);
    /* never strand the user behind the loading overlay */
    const ov=document.getElementById('loading-overlay');
    if(ov){ov.classList.add('hide');setTimeout(()=>ov.style.display='none',700);}
  }
});
</script>
<script>
/* ══ SSA→VR BRIDGE SHIM v2 (injected) ══ */
(function(){
  /* VR scope guard: terrestrial (non-SSA) feeds are disabled — returns 503 so the
     engine takes its normal graceful-degrade path instead of hanging on a fetch. */
  try{
    var _FT=window.fetch;
    window.fetch=function(u,o){
      var url=(typeof u==='string')?u:((u&amp;&amp;u.url)||'');
      if(/open-meteo\.com|air-quality-api|bigdatacloud\.net|timeapi\.io/i.test(url))
        return Promise.resolve(new Response('',{status:503,statusText:'disabled in VR build'}));
      return _FT.apply(this,arguments);
    };
  }catch(e){}
  /* feed cache for TLE / SOCRATES / OrbitSmith responses: 6 h TTL, served stale if
     the network fails. Uses the Cache API (large quota, async) instead of
     localStorage (≈5 MB shared with the dashboard, synchronous, never evicted).
     Proxy URLs are unwrapped so one response is stored once, whichever route won. */
  try{
    var _F=window.fetch, CACHE='ssa-feed-v1', TTL=21600000;
    try{ Object.keys(localStorage).forEach(function(k){ if(/^vrt(le|s):/.test(k)) localStorage.removeItem(k); }); }catch(e){}
    var realUrl=function(url){
      var m=url.match(/corsproxy\.io\/\?(.+)$/)||url.match(/allorigins\.win\/raw\?url=(.+)$/);
      try{ return m?decodeURIComponent(m[1]):url; }catch(e){ return url; }
    };
    window.fetch=function(u,o){
      var url=(typeof u==='string')?u:((u&amp;&amp;u.url)||'');
      var gd=(!o||!o.method||String(o.method).toUpperCase()==='GET');
      if(!(gd&amp;&amp;/celestrak|orbitsmith|socrates/i.test(url))||!window.caches) return _F.apply(this,arguments);
      var self=this, args=arguments, real=realUrl(url);
      var key='https://ssa-cache.local/?u='+encodeURIComponent(real);
      return caches.open(CACHE).then(function(c){ return c.match(key).then(function(hit){ return {c:c,hit:hit}; }); })
        .catch(function(){ return {c:null,hit:null}; })   /* cache unavailable: plain network */
        .then(function(x){
          var c=x.c, hit=x.hit;
          if(hit&amp;&amp;Date.now()-(+hit.headers.get('x-cached-at')||0)<TTL) return hit;
          return _F.apply(self,args).then(function(r){
            if(c&amp;&amp;r&amp;&amp;r.ok){ r.clone().text().then(function(tx){
              /* never cache a proxy's HTML error page in place of data */
              if(tx&amp;&amp;!(/^\s*</.test(tx)&amp;&amp;!/\/SOCRATES\/$/.test(real)))
                c.put(key,new Response(tx,{headers:{'x-cached-at':String(Date.now()),'content-type':r.headers.get('content-type')||'text/plain'}}));
            }).catch(function(){}); }
            return r;
          }).catch(function(err){ if(hit) return hit; throw err; });   /* stale-if-error */
        });
    };
  }catch(e){}
  function mk(){
    try{
      window.__SSA_BRIDGE={
        ready:true,
        get SEL(){return SEL;},
        get EPOCH(){return EPOCH;},
        get allSats(){return allSats;},
        get currentTLE(){return currentTLE;},
        get SEL_COLORS(){return SEL_COLORS;},
        get CAT(){return (typeof CAT!=='undefined')?CAT:null;},
        get CA(){return (typeof CA!=='undefined')?CA:null;},
        get DISC(){return (typeof DISC!=='undefined')?DISC:null;},
        get SITE(){return SITE;},
        makePrimary:function(sn){try{makePrimary(sn);}catch(e){}},
        consts:{MU_E:MU_E,RE_KM:RE_KM,WE:WE},
        get satellite(){return window.satellite;},
        selectSat:function(t){return selectSat(t);},
        renderAllSel:function(){return renderAllSel();},
        startTimers:function(){return startTimers();},
        setRate:function(r){try{EPOCH.setRate(r);}catch(e){}},
        pump:function(){try{EPOCH.tick(performance.now());}catch(e){}},
        setHorizon:function(sec){try{HORIZON_S=sec;}catch(e){}},
        setOffset:function(ms){try{EPOCH.setOffset(ms);}catch(e){}},
        liveNow:function(){try{EPOCH.live();}catch(e){}},
        offsetMs:function(){try{return EPOCH.offsetMs();}catch(e){return 0;}},
        now:function(){return EPOCH.now();},
        ms:function(){return EPOCH.ms();},
        rate:function(){return EPOCH.rate;},
        gmst:function(d){return gmst_from_jd(julianDate(d));},
        sunECI:function(d){try{return sunECIUnit(d);}catch(e){return [1,0,0];}},
        initDisc:function(){try{if(typeof DISC!=='undefined'&amp;&amp;!DISC.inited)DISC.init();}catch(e){}},
        initCatalog:function(){try{if(typeof CAT!=='undefined'){if(!CAT.inited)CAT.init();CAT.loadChecked();}}catch(e){}},
        /* SOCRATES fallback is handled (and labelled) by CA.refresh itself; the VR
           layer must never inject sample pairs on its own timer */
        initCA:function(){try{
          if(typeof CA==='undefined')return;
          if(CA.init&amp;&amp;!CA.inited)CA.init(); else if(CA.refresh)CA.refresh();
        }catch(e){}},
        caStatus:function(){try{return CA._src||'';}catch(e){return '';}},
        clearSel:function(){try{while(SEL.length)deselectSat(SEL[SEL.length-1].tle.satnum);}catch(e){}},
        switchView:function(v){try{switchView(v);}catch(e){}}
      };
      if(typeof CA!=='undefined'&amp;&amp;typeof CA.select==='function'&amp;&amp;!CA.__vrWrapped){
        CA.__vrWrapped=true;
        var _o=CA.select.bind(CA);
        CA.select=function(i){
          CA.t1=null; CA.t2=null;
          var r=_o(i), n=0;
          var okRec=function(r){
            try{
              if(!r || !isFinite(r.jdsatepoch)) return false;
              var pv=window.satellite.propagate(r,new Date());
              return !!(pv &amp;&amp; pv.position &amp;&amp; isFinite(pv.position.x)
                        &amp;&amp; isFinite(pv.position.y) &amp;&amp; isFinite(pv.position.z));
            }catch(e){ return false; }
          };
          var ensure=function(t){
            if(!t) return null;
            if(t.satrec &amp;&amp; okRec(t.satrec)) return t;
            if(t.satrec){ try{ delete t.satrec; }catch(e){} }
            try{
              if(typeof t==='string' &amp;&amp; window.satellite){
                var L=t.split(/\r?\n/).filter(function(x){return x.trim();});
                var i1=L.findIndex(function(x){return x.trim()[0]==='1';});
                if(i1>=0 &amp;&amp; L[i1+1]) return {satrec:window.satellite.twoline2satrec(L[i1],L[i1+1]),name:(i1>0?L[0].trim():'')};
              } else if(t.line1&amp;&amp;t.line2&amp;&amp;window.satellite){
                t.satrec=window.satellite.twoline2satrec(t.line1,t.line2); return t;
              }
            }catch(e){}
            return t;
          };
          var poll=setInterval(function(){
            n++;
            var a=ensure(CA.t1), b=ensure(CA.t2);
            if(a&amp;&amp;a.satrec&amp;&amp;b&amp;&amp;b.satrec){
              clearInterval(poll);
              try{window.dispatchEvent(new CustomEvent('ssa:ca-select',
                {detail:{pair:(CA._view&amp;&amp;CA._view[i])||null,t1:a,t2:b}}));}catch(e){}
            } else if(n>25){
              clearInterval(poll);
              var why=(!CA.t1||!CA.t2)?'TLE FETCH FAILED':'SATREC BUILD FAILED';
              try{window.dispatchEvent(new CustomEvent('ssa:ca-select-failed',
                {detail:{reason:why,pair:(CA._view&amp;&amp;CA._view[i])||null}}));}catch(e){}
            }
          },400);
          return r;
        };
      }
      console.info('[ssa-bridge] v2 ready');
    }catch(e){ console.error('[ssa-bridge] retry',e); setTimeout(mk,500); }
  }
  if(document.readyState!=='loading') setTimeout(mk,400);
  else window.addEventListener('DOMContentLoaded',function(){setTimeout(mk,400);});
})();
</script>
