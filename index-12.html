.pr-rise{color:var(--green);font-size:8px;}.pr-set{color:var(--red);font-size:8px;}
.pr-el{color:var(--amber);font-size:8px;}.pr-dur{color:var(--muted);font-size:8px;}.pr-az{color:var(--muted);font-size:8px;}
.site-info-gt{position:absolute;bottom:7px;left:11px;z-index:20;font-size:8px;font-family:var(--font-hud);color:var(--muted);}
.auto-refresh-badge{position:absolute;bottom:7px;right:11px;z-index:20;font-size:7px;font-family:var(--font-hud);
  color:var(--green);display:flex;align-items:center;gap:4px;}
.refresh-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}

/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:#000a10f2;z-index:999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.spinner{width:42px;height:42px;border:2px solid var(--dim);border-top-color:var(--accent);
  border-radius:50%;animation:spin 1s linear infinite;}
.load-text{font-family:var(--font-hud);font-size:11px;color:var(--accent);letter-spacing:3px;}
.load-sub{font-size:9px;color:var(--muted);font-family:var(--font-hud);max-width:380px;text-align:center;}

/* Tooltip */
#tooltip{position:fixed;background:#000d16ee;border:1px solid var(--accent);padding:5px 9px;
  font-family:var(--font-hud);font-size:9px;color:var(--accent);pointer-events:none;z-index:200;
  border-radius:2px;display:none;white-space:nowrap;}
/* ── OBSERVING CONDITIONS STRIP ── */
#wx-strip{padding:5px 14px 4px;border-bottom:1px solid var(--border);background:#040c12;flex-shrink:0;}
.wx-header{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.wx-title{font-family:var(--font-head);font-size:8px;letter-spacing:2px;color:var(--purple);flex-shrink:0;}
.wx-site{font-size:8px;color:var(--muted);font-family:var(--font-hud);}
.wx-status{font-size:7px;color:var(--muted);font-family:var(--font-hud);margin-left:auto;}
#wx-timeline{display:flex;flex-direction:column;gap:2px;}
.wx-row{display:flex;align-items:center;gap:6px;}
.wx-row-label{font-size:7px;color:var(--muted);font-family:var(--font-hud);width:36px;flex-shrink:0;letter-spacing:1px;}
.wx-cells{display:flex;gap:1px;flex:1;overflow:hidden;}
.wx-cell{flex:1;min-width:0;height:12px;border-radius:1px;position:relative;cursor:default;transition:opacity .15s;}
.wx-cell:hover{opacity:.75;outline:1px solid rgba(255,255,255,.25);}
.wx-cell-label{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:6px;color:var(--muted);font-family:var(--font-hud);white-space:nowrap;pointer-events:none;margin-bottom:1px;}
.wx-now-marker{position:absolute;top:0;bottom:0;width:1px;background:var(--amber);opacity:.8;pointer-events:none;z-index:5;}

/* Update main grid to fit the strip */
#main{display:grid;grid-template-rows:auto auto 1fr;overflow:hidden;}

/* Refresh interval slider */
.refresh-interval-wrap{display:flex;align-items:center;gap:6px;padding:2px 0 0;}
.ri-label{font-size:7px;color:var(--muted);font-family:var(--font-hud);white-space:nowrap;}
#refresh-slider{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:var(--dim);outline:none;border-radius:2px;cursor:pointer;}
#refresh-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer;}
#refresh-slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer;border:none;}
#refresh-val{font-size:9px;color:var(--accent);font-family:var(--font-hud);min-width:22px;text-align:right;}

/* ═══════════════ V2 OVERHAUL — LAYOUT &amp; TABS ═══════════════ */
#app{display:flex;flex-direction:column;height:100vh;grid-template-columns:none;grid-template-rows:none;}
#header{flex:0 0 54px;grid-column:auto;}
.view{flex:1;min-height:0;overflow:hidden;display:none;}
.view.active{display:grid;}
#view-tracker.active{display:grid;grid-template-columns:310px 1fr;}
#view-catalog.active{display:flex;flex-direction:column;}
#view-eph.active{display:grid;grid-template-columns:258px 1fr;}

#tab-nav{display:flex;gap:2px;margin-left:26px;height:100%;align-items:stretch;}
.tab-btn{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);
  font-family:var(--font-head);font-size:9px;letter-spacing:2.5px;padding:0 16px;cursor:pointer;
  transition:color .15s,border-color .15s,text-shadow .15s;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);text-shadow:0 0 12px rgba(0,212,255,.6);}
.tab-btn .tb-sub{display:block;font-size:6px;letter-spacing:1px;color:var(--muted);font-family:var(--font-hud);margin-top:2px;}

/* pass table now has a VIS column */
.pass-row{grid-template-columns:48px 48px 24px 40px 34px 30px;}
.vis-chip{font-size:7px;padding:0 3px;border-radius:2px;font-family:var(--font-hud);font-weight:bold;text-align:center;}
.vc-vis{background:rgba(0,255,136,.22);color:var(--green);box-shadow:0 0 6px rgba(0,255,136,.35);}
.vc-ecl{background:rgba(120,120,160,.18);color:#8899bb;}
.vc-day{background:rgba(255,170,0,.14);color:#bb8833;}
.pi-vis{background:var(--green);box-shadow:0 0 7px var(--green);}
.pi-soon{background:var(--accent);box-shadow:0 0 5px var(--accent);}

#sky-legend{position:absolute;bottom:7px;left:11px;z-index:10;font-size:7px;font-family:var(--font-hud);
  color:var(--muted);display:flex;gap:9px;pointer-events:none;}
.skl{display:flex;align-items:center;gap:3px;}
.skl i{display:inline-block;width:10px;height:2px;}
#sky-sunmoon{position:absolute;bottom:7px;right:11px;z-index:10;font-size:7px;font-family:var(--font-hud);color:var(--muted);pointer-events:none;text-align:right;}

/* ═══════════════ CATALOG 3D VIEW ═══════════════ */
#cat-toolbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:6px 14px;
  background:#040c12;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.ct-group{display:flex;align-items:center;gap:6px;}
.ct-lbl{font-size:7px;color:var(--muted);letter-spacing:2px;font-family:var(--font-hud);}
#cat-group-sel{width:170px;}
.tw-btn{background:transparent;border:1px solid var(--dim);color:var(--muted);font-family:var(--font-hud);
  font-size:9px;padding:3px 8px;cursor:pointer;border-radius:2px;transition:all .12s;min-width:30px;}
.tw-btn:hover{border-color:var(--accent);color:var(--accent);}
.tw-btn.on{border-color:var(--amber);color:var(--amber);background:rgba(255,170,0,.08);box-shadow:0 0 8px rgba(255,170,0,.25);}
#cat-simclock{font-family:var(--font-hud);font-size:11px;color:var(--green);letter-spacing:1px;}
#cat-simoffset{font-size:8px;color:var(--amber);font-family:var(--font-hud);}
#cat-counts{margin-left:auto;font-size:8px;color:var(--muted);font-family:var(--font-hud);}
#cat-stage{flex:1;position:relative;min-height:0;background:#010509;}
#cat-canvas-wrap{position:absolute;inset:0;}
#cat-canvas-wrap canvas{position:absolute;inset:0;}
#cat-legend{position:absolute;bottom:10px;left:12px;z-index:10;display:flex;gap:12px;
  font-size:8px;font-family:var(--font-hud);color:var(--muted);background:rgba(0,8,14,.55);
  padding:5px 9px;border:1px solid var(--border);border-radius:2px;pointer-events:none;}
.cl-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:-1px;}
#cat-hover{position:absolute;display:none;z-index:30;background:#000d16f0;border:1px solid var(--accent);
  padding:7px 10px;border-radius:2px;pointer-events:none;font-family:var(--font-hud);min-width:150px;}
#cat-hover .ch-name{font-size:10px;color:#fff;letter-spacing:1px;margin-bottom:3px;}
#cat-hover .ch-row{font-size:8px;color:var(--accent);display:flex;justify-content:space-between;gap:12px;}
#cat-hover .ch-row span:first-child{color:var(--muted);}
#cat-card{position:absolute;top:12px;right:12px;width:252px;z-index:25;background:#000d16ee;
  border:1px solid var(--border);border-radius:2px;display:none;backdrop-filter:blur(3px);}
.cc-head{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--border);}
.cc-name{font-family:var(--font-head);font-size:10px;color:#fff;letter-spacing:1px;flex:1;line-height:1.3;}
.cc-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;}
.cc-close:hover{color:var(--red);}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;padding:8px 10px;}
.cc-row{display:flex;justify-content:space-between;align-items:baseline;}
.cc-k{font-size:7px;color:var(--muted);font-family:var(--font-hud);letter-spacing:1px;}
.cc-v{font-size:9px;color:var(--accent);font-family:var(--font-hud);}
.cc-btns{display:flex;gap:5px;padding:0 10px 9px;}
#cat-progress{position:absolute;top:12px;left:12px;z-index:25;background:#000d16ee;border:1px solid var(--border);
  padding:7px 12px;border-radius:2px;font-family:var(--font-hud);font-size:9px;color:var(--accent);display:none;}
#cat-help{position:absolute;bottom:10px;right:12px;z-index:10;font-size:7px;font-family:var(--font-hud);color:var(--muted);text-align:right;pointer-events:none;}
#cat-filter-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;gap:6px;background:rgba(2,10,18,.78);backdrop-filter:blur(3px);
  border:1px solid var(--border);border-radius:3px;padding:5px 6px;}
.cfb-btn{background:transparent;border:1px solid transparent;color:var(--muted);
  font-family:var(--font-hud);font-size:9px;letter-spacing:1.5px;padding:5px 11px;cursor:pointer;
  border-radius:2px;transition:color .15s,border-color .15s,background .15s;}
.cfb-btn:hover{color:var(--text);}
.cfb-btn.on{color:var(--accent);border-color:var(--accent);background:rgba(0,212,255,.08);
  text-shadow:0 0 10px rgba(0,212,255,.5);}

/* ═══════════════ EPHEMERIS VIEW ═══════════════ */
#eph-side{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#eph-side-head{padding:10px 12px 8px;border-bottom:1px solid var(--border);}
#eph-targets{flex:1;overflow-y:auto;padding:2px 0;}
#eph-targets::-webkit-scrollbar{width:3px;}
#eph-targets::-webkit-scrollbar-thumb{background:var(--dim);}
.eph-cat{padding:6px 12px 3px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.eph-cat input{accent-color:var(--accent);width:10px;height:10px;}
.eph-cat-lbl{font-family:var(--font-head);font-size:8px;letter-spacing:2px;color:var(--purple);}
.eph-item{padding:6px 12px 6px 26px;cursor:pointer;border-left:2px solid transparent;display:flex;align-items:center;gap:7px;transition:all .1s;}
.eph-item:hover{background:#0a1820;border-left-color:var(--accent);}
.eph-item.active{background:#071520;border-left-color:var(--amber);}
.eph-item .ei-name{font-size:10px;color:var(--text);font-family:var(--font-hud);flex:1;}
.eph-item .ei-glyph{font-size:11px;width:14px;text-align:center;color:var(--accent);}
.eph-item .ei-stat{font-size:7px;font-family:var(--font-hud);}
#eph-custom{padding:9px 12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px;}
#eph-custom input{background:#000d16;border:1px solid var(--dim);color:var(--text);font-family:var(--font-mono);
  font-size:10px;padding:5px 8px;outline:none;border-radius:2px;}
#eph-custom input:focus{border-color:var(--purple);}
#eph-main{display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;min-height:0;}
#eph-main::-webkit-scrollbar{width:4px;}
#eph-main::-webkit-scrollbar-thumb{background:var(--dim);}
#eph-head{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid var(--border);background:#040c12;flex-wrap:wrap;}
#eph-target-name{font-family:var(--font-head);font-size:14px;color:#fff;letter-spacing:2px;}
#eph-target-sub{font-size:8px;color:var(--muted);font-family:var(--font-hud);}
.verdict{font-family:var(--font-hud);font-size:9px;letter-spacing:1px;padding:4px 10px;border-radius:2px;border:1px solid;}
.verdict.v-vis{color:var(--green);border-color:var(--green);background:rgba(0,255,136,.08);box-shadow:0 0 12px rgba(0,255,136,.25);animation:pulse 3s infinite;}
.verdict.v-bright{color:var(--amber);border-color:var(--amber);background:rgba(255,170,0,.07);}
.verdict.v-down{color:var(--muted);border-color:var(--dim);}
#eph-minel-wrap{display:flex;align-items:center;gap:7px;margin-left:auto;}
#eph-minel{width:90px;-webkit-appearance:none;appearance:none;height:2px;background:var(--dim);border-radius:2px;cursor:pointer;}
#eph-minel::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--purple);cursor:pointer;}
#eph-now-grid{display:flex;flex-wrap:wrap;gap:11px;padding:8px 16px;border-bottom:1px solid var(--border);background:#030a10;}
#eph-chart-panel{position:relative;padding:10px 16px 4px;}
#eph-chart{width:100%;height:250px;display:block;cursor:crosshair;}
.eph-section-title{font-family:var(--font-head);font-size:8px;letter-spacing:2px;color:var(--accent);padding:10px 16px 4px;}
#eph-windows{padding:0 16px 8px;}
.ew-row{display:grid;grid-template-columns:1.3fr 1.3fr 56px 60px 52px 44px;gap:6px;padding:4px 8px;
  border-bottom:1px solid #0a1820;font-family:var(--font-hud);font-size:9px;align-items:center;}
.ew-row.hdr{color:var(--muted);font-size:7px;letter-spacing:1px;}
.ew-row:not(.hdr):hover{background:#0a1820;}
#eph-log{margin:6px 16px 14px;padding:8px 10px;background:#000d16;border:1px solid var(--dim);border-radius:2px;
  font-size:8px;color:var(--muted);font-family:var(--font-hud);white-space:pre-wrap;max-height:130px;overflow-y:auto;display:none;}
#eph-empty{padding:60px 30px;text-align:center;color:var(--muted);font-size:10px;font-family:var(--font-hud);line-height:2.2;}
#eph-tip{position:fixed;display:none;z-index:300;background:#000d16f0;border:1px solid var(--purple);
  padding:6px 9px;border-radius:2px;pointer-events:none;font-family:var(--font-hud);font-size:8px;color:var(--text);line-height:1.7;white-space:nowrap;}
.eph-att{padding:2px 16px 12px;font-size:7px;color:var(--muted);font-family:var(--font-hud);letter-spacing:1px;}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

/* loading overlay fade-out */
#loading-overlay{transition:opacity .6s ease;}
#loading-overlay.hide{opacity:0;pointer-events:none;}

/* eph now-grid cells */
.eg{min-width:86px;}
.eg-k{font-size:7px;color:var(--muted);font-family:var(--font-hud);letter-spacing:1px;margin-bottom:2px;}
.eg-v{font-size:11px;color:var(--text);font-family:var(--font-hud);}
.eg-v.green{color:var(--green);}.eg-v.amber{color:var(--amber);}
.eph-nowin{padding:10px;font-size:9px;color:var(--muted);font-family:var(--font-hud);letter-spacing:1px;border:1px dashed var(--dim);border-radius:2px;text-align:center;}

/* ═══════════════════ V3 · VISUAL OVERHAUL ═══════════════════ */
/* brighter, readable palette — fixes muted-gray-on-black legibility */
:root{
  --bg:#020509;--panel:#08111a;--border:#16344b;
  --accent:#00e5ff;--amber:#ffd24a;--green:#00ff9d;--red:#ff5566;--purple:#b48bff;--magenta:#ff4fd8;
  --dim:#22455e;--text:#e6f3fb;--muted:#8aa3b5;
  --line:#16344b;   /* used by the V4/V5 panels; was never defined */
}
html,body{background:
  radial-gradient(1100px 500px at 78% -8%, rgba(0,90,140,.13), transparent 60%),
  radial-gradient(900px 600px at -10% 110%, rgba(90,40,160,.10), transparent 55%),
  var(--bg);}

/* subtle scanline film over the whole console */
#app::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:400;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px);}

/* ── header ── */
#header{background:linear-gradient(180deg,#0a151f,#060d14);border-bottom:1px solid var(--border);
  box-shadow:0 1px 18px rgba(0,229,255,.07);}
.logo{text-shadow:0 0 14px rgba(0,229,255,.5);}
.header-sub{color:var(--muted);}
#utc-clock,#local-clock{color:var(--text);text-shadow:0 0 8px rgba(0,229,255,.35);}
.tab-btn{font-size:10px;position:relative;}
.tab-btn.active::after{content:'';position:absolute;left:12px;right:12px;bottom:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 10px var(--accent);}

/* ── panels: corner-bracket futuristic frames ── */
.plot-panel{background:linear-gradient(180deg,#091420,#070f17);border:1px solid var(--border);
  position:relative;border-radius:3px;}
.plot-panel::before,.plot-panel::after{content:'';position:absolute;width:14px;height:14px;
  border:1px solid rgba(0,229,255,.55);pointer-events:none;z-index:5;}
.plot-panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
.plot-panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
.plot-label{color:var(--accent);font-size:9px;letter-spacing:3px;text-shadow:0 0 9px rgba(0,229,255,.4);}
.plot-status{color:var(--muted);}

/* ── meta strip: airier, brighter, grouped ── */
#meta-strip{background:linear-gradient(180deg,#081320,#060d15);border-bottom:1px solid var(--border);
  gap:16px;padding:9px 16px;align-items:center;}
#selected-sat-name{font-size:15px;text-shadow:0 0 12px rgba(0,229,255,.45);letter-spacing:2px;}
#norad-id{color:var(--muted);font-size:9px;}
.mi{padding:0 4px;}
.ml{font-size:7px;color:var(--muted);letter-spacing:1.6px;margin-bottom:3px;}
.mv{font-size:12px;color:var(--text);}
.mv.green{color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.4);}
.mv.amber{color:var(--amber);text-shadow:0 0 8px rgba(255,210,74,.35);}
.mv.red{color:var(--red);}
.mv.purple{color:var(--purple);}

/* ── sidebar readability ── */
.sat-name{font-size:11px;color:var(--text);}
.sat-meta{color:var(--muted);}
.sat-item{border-left:2px solid transparent;transition:background .12s,border-color .12s;}
.sat-item:hover{background:#0c1a28;border-left-color:var(--accent);}
.sat-item.active{background:#0a1d2e;border-left-color:var(--amber);box-shadow:inset 0 0 22px rgba(0,229,255,.05);}
.oe-key{color:var(--muted);}
.oe-val{color:var(--text);}
.loading-list{color:var(--muted);}

/* ── wx strip: collapsed by default → tidy single header line ── */
#wx-strip #wx-timeline{display:none;}
#wx-strip.open #wx-timeline{display:block;}
.wx-toggle{margin-left:auto;font-size:8px;color:var(--accent);cursor:pointer;font-family:var(--font-hud);
  letter-spacing:1.5px;padding:2px 8px;border:1px solid var(--dim);border-radius:2px;transition:all .12s;}
.wx-toggle:hover{border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,.3);}
.wx-row-label{color:var(--muted);}

/* ── pass table / chips ── */
.pass-row{font-size:9px;}
.pass-row.hdr span{color:var(--muted);}
.pass-row.is-vis{background:rgba(0,255,157,.05);}
.pass-row:not(.hdr):hover{background:#0c1a28;}
.vis-chip{font-size:7px;}

/* ── buttons ── */
.hud-btn{border-color:var(--dim);color:var(--text);transition:all .13s;}
.hud-btn:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(0,229,255,.3);}
.hud-btn.sm{flex:none;padding:3px 8px;font-size:9px;}
.hud-sel{background:#06101a;border:1px solid var(--dim);color:var(--text);}
.tw-btn{color:var(--muted);}
.tw-btn:hover{box-shadow:0 0 8px rgba(0,229,255,.25);}
.tw-btn.on{box-shadow:0 0 10px rgba(255,210,74,.35);}

/* ── catalog ── */
#cat-toolbar{background:linear-gradient(180deg,#081320,#060d15);}
#cat-simclock{text-shadow:0 0 9px rgba(0,255,157,.4);}
#cat-legend{background:rgba(2,10,18,.7);backdrop-filter:blur(2px);color:var(--text);}
#cat-help{color:var(--muted);}
#cat-hover{border-color:var(--accent);box-shadow:0 0 18px rgba(0,229,255,.22);}
#cat-card{box-shadow:0 0 24px rgba(0,229,255,.14);border-color:var(--border);}

/* ═══ EPHEMERIS V3 ═══ */
#eph-fetch-state{font-size:8px;color:var(--muted);font-family:var(--font-hud);margin-left:auto;}
.eph-head-sub{font-size:7px;color:var(--muted);font-family:var(--font-hud);margin-top:4px;letter-spacing:1px;}
#eph-clockrow{display:flex;gap:12px;margin-top:6px;font-family:var(--font-hud);font-size:10px;}
#eph-clockrow #eph-utc{color:var(--accent);text-shadow:0 0 8px rgba(0,229,255,.4);}
#eph-clockrow #eph-local{color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.35);}
.ei-name{color:var(--text);}
.eph-item:hover{background:#0c1a28;}

#eph-head{row-gap:8px;}
#eph-obs-chip{display:flex;align-items:center;gap:7px;font-family:var(--font-hud);font-size:9px;
  border:1px solid var(--dim);border-radius:2px;padding:4px 9px;background:#06101a;}
#eph-site-txt{color:var(--text);}
#eph-site-sel{width:96px;font-size:8px;}
#eph-site-form{display:none;align-items:center;gap:7px;padding:7px 16px;background:#06101a;
  border-bottom:1px solid var(--border);flex-wrap:wrap;}
#eph-site-form .site-input{width:84px;}
#eph-minel-val{font-size:9px;color:var(--purple);font-family:var(--font-hud);}

/* solar-system panel */
#ss-panel{margin:10px 16px 4px;border:1px solid var(--border);border-radius:3px;position:relative;
  background:linear-gradient(180deg,#070f18,#04090f);}
#ss-panel::before,#ss-panel::after{content:'';position:absolute;width:14px;height:14px;
  border:1px solid rgba(180,139,255,.6);pointer-events:none;z-index:5;}
#ss-panel::before{top:-1px;left:-1px;border-right:none;border-bottom:none;}
#ss-panel::after{bottom:-1px;right:-1px;border-left:none;border-top:none;}
#ss-toolbar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;background:rgba(4,10,18,.8);}
.ss-title{font-family:var(--font-head);font-size:8px;letter-spacing:2px;color:var(--purple);
  text-shadow:0 0 9px rgba(180,139,255,.45);margin-right:4px;}
#ss-date{font-family:var(--font-hud);font-size:10px;color:var(--green);text-shadow:0 0 8px rgba(0,255,157,.35);}
#ss-offset{font-family:var(--font-hud);font-size:8px;color:var(--amber);}
.ss-sep{width:1px;height:14px;background:var(--dim);margin:0 3px;}
#ss-wrap{height:340px;position:relative;}
#ss-wrap canvas{display:block;}
#ss-help{position:absolute;bottom:7px;right:11px;font-size:7px;font-family:var(--font-hud);
  color:var(--muted);pointer-events:none;letter-spacing:1px;}

/* plotted chips */
#eph-plotted{display:flex;align-items:center;gap:7px;padding:8px 16px 0;flex-wrap:wrap;}
#eph-plotted:empty{display:none;}
.ep-lbl{font-size:7px;color:var(--muted);font-family:var(--font-hud);letter-spacing:2px;}
.ep-chip{font-family:var(--font-hud);font-size:9px;color:var(--c);border:1px solid var(--c);
  border-radius:2px;padding:3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.25);opacity:.7;transition:all .13s;}
.ep-chip:hover{opacity:1;}
.ep-chip.on{opacity:1;box-shadow:0 0 10px var(--c);background:rgba(255,255,255,.04);}
.ep-chip i{font-style:normal;color:var(--muted);cursor:pointer;font-size:8px;}
.ep-chip i:hover{color:var(--red);}

/* now-grid + chart */
.eg-k{color:var(--muted);}
.eg-v{color:var(--text);font-size:11px;}
.eg-v.accent{color:var(--accent);}
#eph-chart{height:280px;}
#eph-chart-legend{display:flex;gap:13px;padding:5px 2px 2px;font-size:7px;font-family:var(--font-hud);
  color:var(--muted);flex-wrap:wrap;letter-spacing:1px;}
.ecl-i{display:flex;align-items:center;gap:4px;}
.ecl-i i{display:inline-block;width:11px;height:5px;border-radius:1px;}
.ew-row{font-size:10px;}
.ew-row.hdr{color:var(--muted);}
.eph-att{color:var(--muted);}
#eph-empty{color:var(--muted);font-size:11px;}
.verdict.v-vis{text-shadow:0 0 8px rgba(0,255,157,.5);}

/* global text-contrast lift on remaining legacy grays */
.ck-label,.fl,.site-label,.oe-toggle,.site-toggle{color:var(--muted);}
.sat-inc{color:var(--muted);}

/* ════ V4 · GLOBAL EPOCH CLOCK (baseline HUD) ════ */
#app{padding-bottom:34px;}
#epoch-bar{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:60;
  display:flex;align-items:center;gap:10px;padding:0 14px;
  background:linear-gradient(180deg,rgba(4,12,20,.92),rgba(2,7,12,.97));
  border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(0,229,255,.07);
  font-family:'IBM Plex Mono',monospace;font-size:10px;backdrop-filter:blur(4px);}
.ep-dot{width:8px;height:8px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px #ffb347;}
.ep-dot.live{background:#00ff9d;box-shadow:0 0 8px #00ff9d;animation:eppulse 2s infinite;}
@keyframes eppulse{0%,100%{opacity:1}50%{opacity:.45}}
#ep-clock{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;color:var(--text);}
#ep-local{color:var(--muted);}
#ep-offset.live{color:#00ff9d;}
#ep-offset.off{color:#ffd24a;}
#ep-scrub{flex:1;max-width:420px;accent-color:var(--accent);height:3px;cursor:pointer;}
.ep-lbl{color:var(--muted);font-size:8px;letter-spacing:1px;}
#epoch-bar .tw-btn{padding:2px 8px;}

/* ════ V4 · OBSERVER — selection chips · horizon cluster · vis toggle ════ */
#sel-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px 6px;align-items:center;
  border-bottom:1px solid var(--line);background:rgba(3,10,17,.5);min-height:0;}
#sel-chips:empty{display:none;}
.sel-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.5px;color:var(--c);
  border:1px solid var(--c);border-radius:2px;background:rgba(0,0,0,.3);
  box-shadow:0 0 7px color-mix(in srgb,var(--c) 30%,transparent),inset 0 0 8px rgba(0,0,0,.4);}
.sel-chip.prim{background:color-mix(in srgb,var(--c) 14%,transparent);}
.sel-chip i{font-style:normal;opacity:.7;cursor:pointer;}
.sel-chip i:hover{opacity:1;color:#ff5566;}
.sel-hint{color:var(--muted);font-size:8px;letter-spacing:1px;}
.hz-row{display:flex;gap:4px;margin-top:2px;}
.hz-btn{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.5px;padding:2px 7px;
  background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--muted);cursor:pointer;border-radius:2px;}
.hz-btn:hover{color:var(--text);border-color:var(--accent);}
.hz-btn.on{color:var(--accent);border-color:var(--accent);box-shadow:0 0 7px rgba(0,229,255,.35);}
#sky-vis-btn{position:absolute;top:6px;right:8px;z-index:5;}
#sky-vis-btn.on{color:#00ff9d;border-color:#00ff9d;box-shadow:0 0 8px rgba(0,255,157,.4);}
#sat-list .sat-item.co-sel{border-left:3px solid var(--selc);background:rgba(255,255,255,.025);}
#sat-list .sat-item.active{border-left:3px solid var(--selc,#00e5ff);}

/* ════ V4 · CATALOG — multi-select bucket dropdown ════ */
#cat-groups-menu{display:none;position:absolute;top:26px;left:0;z-index:40;min-width:240px;
  max-height:340px;overflow-y:auto;background:rgba(4,12,20,.97);border:1px solid var(--accent);
  box-shadow:0 0 22px rgba(0,229,255,.25);padding:4px 0;}
#cat-groups-menu.open{display:block;}
.cg-item{display:flex;align-items:center;gap:8px;padding:4px 10px;cursor:pointer;
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.5px;color:var(--text);}
.cg-item:hover{background:rgba(0,229,255,.08);}
.cg-item input{accent-color:var(--accent);}

/* ════ V4 · EPHEMERIS — SBDB results · big telemetry overlay ════ */
#eph-sbdb-results{margin:4px 0;border:1px solid var(--line);background:rgba(2,8,14,.9);max-height:180px;overflow-y:auto;}
.sbdb-row{padding:5px 8px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.4px;border-bottom:1px solid rgba(20,42,60,.5);}
.sbdb-row:last-child{border-bottom:none;}
.sbdb-row.hit{color:var(--text);cursor:pointer;}
.sbdb-row.hit:hover{background:rgba(0,229,255,.1);color:var(--accent);}
.sbdb-row.dim{color:var(--muted);}
.sbdb-row.nores{color:#ff5566;text-shadow:0 0 8px rgba(255,85,102,.5);border-left:3px solid #ff5566;animation:noresflash .5s;}
@keyframes noresflash{0%{background:rgba(255,85,102,.25)}100%{background:transparent}}
.sbdb-sub{display:block;font-size:8px;color:var(--muted);margin-top:1px;}
#ss-wrap{position:relative;}
#ss-info{position:absolute;top:10px;right:10px;z-index:8;width:265px;
  background:rgba(3,10,18,.93);border:1px solid var(--accent);
  box-shadow:0 0 24px rgba(0,229,255,.2),inset 0 0 30px rgba(0,229,255,.04);
  padding:10px 12px;font-family:'IBM Plex Mono',monospace;backdrop-filter:blur(3px);}
.ssi-name{font-family:'Orbitron',monospace;font-size:14px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,.6);}
.ssi-src{font-size:7.5px;color:var(--muted);letter-spacing:1px;margin:2px 0 8px;}
.ssi-grid{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;}
.ssi-k{font-size:8px;color:var(--muted);letter-spacing:.8px;padding-top:1px;}
.ssi-v{font-size:10.5px;color:var(--text);}
.ssi-v.mono{font-size:9.5px;line-height:1.35;}
.ssi-sub{display:block;font-size:7.5px;color:var(--muted);margin-top:1px;}
.ssi-foot{margin-top:9px;text-align:center;font-size:8.5px;letter-spacing:1px;color:var(--amber);
  border:1px solid rgba(255,210,74,.4);padding:3px;cursor:pointer;}
.ssi-foot:hover{background:rgba(255,210,74,.1);}

/* ════ V4 · DISCOVERY &amp; ENGAGEMENT CENTER ════ */
#view-disc{overflow-y:auto;padding:14px;position:relative;}
#disc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;max-width:1700px;margin:0 auto;}
.d-panel{position:relative;border:1px solid var(--line);background:linear-gradient(160deg,rgba(6,16,26,.85),rgba(3,9,15,.92));
  padding:12px 14px;box-shadow:inset 0 0 40px rgba(0,229,255,.025);}
.d-panel::before{content:'';position:absolute;top:-1px;left:-1px;width:14px;height:14px;border-top:2px solid var(--accent);border-left:2px solid var(--accent);}
.d-panel::after{content:'';position:absolute;bottom:-1px;right:-1px;width:14px;height:14px;border-bottom:2px solid var(--accent);border-right:2px solid var(--accent);}
.d-title{font-family:'Orbitron',monospace;font-size:12px;letter-spacing:2px;color:var(--text);margin-bottom:10px;}
.d-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;margin-left:8px;}
.d-dim{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.5px;}
#d-pass-panel{grid-row:span 2;}
#d-next-wrap{text-align:center;margin:14px 0;padding:14px 8px;border:1px solid rgba(0,255,157,.3);background:rgba(0,255,157,.04);}
.d-cd-label{font-size:8px;letter-spacing:2px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
#d-next-name{font-family:'Orbitron',monospace;font-size:16px;letter-spacing:2px;color:#00ff9d;text-shadow:0 0 12px rgba(0,255,157,.6);margin:5px 0;}
#d-countdown{font-family:'Orbitron',monospace;font-size:30px;letter-spacing:4px;color:var(--text);text-shadow:0 0 16px rgba(0,229,255,.5);}
#d-next-sub{margin-top:6px;}
.dp-row{display:flex;gap:10px;align-items:baseline;padding:5px 4px;border-bottom:1px solid rgba(20,42,60,.5);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;}
.dp-row.first .dp-name{color:#00ff9d;}
.dp-name{flex:1;color:var(--text);letter-spacing:.5px;}
.dp-mag{color:var(--amber);}
.dp-time{color:var(--muted);}
#d-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.d-card{border:1px solid var(--line);padding:8px 10px;background:rgba(0,0,0,.25);}
.dc-k{font-size:8px;letter-spacing:1.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.dc-v{font-family:'Orbitron',monospace;font-size:17px;color:var(--accent);text-shadow:0 0 10px rgba(0,229,255,.45);margin:3px 0;}
.dc-sub{font-family:'IBM Plex Mono',monospace;font-size:8.5px;color:var(--text);opacity:.85;line-height:1.45;}
.d-hist{grid-column:1/-1;font-family:'IBM Plex Mono',monospace;font-size:9.5px;line-height:1.6;color:var(--text);
  border-left:3px solid var(--purple);padding:7px 10px;background:rgba(180,139,255,.05);}
#d-sb-canvas{height:240px;border:1px solid var(--line);background:#020810;position:relative;}
#d-sb-controls{margin-top:10px;}
.d-slider{margin-bottom:8px;}
.d-slider label{display:block;font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);margin-bottom:3px;}
.d-slider input{width:100%;accent-color:var(--accent);height:3px;}
.d-sb-presets{display:flex;gap:6px;margin:8px 0;}
.d-sb-preset.on{color:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,.35);}
#d-sb-read{display:flex;flex-wrap:wrap;gap:5px 16px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);margin-top:6px;}
#d-sb-read b{color:var(--text);}
.d-regime{color:var(--amber);letter-spacing:.5px;}
.d-wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.d-wx-item{position:relative;border:1px solid var(--line);padding:8px;background:rgba(0,0,0,.25);cursor:help;}
.dw-k{font-size:7.5px;letter-spacing:1.2px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
.dw-v{font-family:'Orbitron',monospace;font-size:18px;color:var(--text);margin:4px 0;}
.dw-tag{font-family:'IBM Plex Mono',monospace;font-size:7.5px;color:var(--muted);letter-spacing:.5px;}
.d-kp-track{height:5px;background:rgba(255,255,255,.07);margin:4px 0;}
#d-kp-bar{height:100%;width:0;background:#00ff9d;transition:width .6s,background .6s;box-shadow:0 0 8px currentColor;}
.d-wx-item[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:260px;
  background:rgba(4,12,20,.98);border:1px solid var(--amber);padding:9px 11px;
  font-family:'IBM Plex Mono',monospace;font-size:9px;line-height:1.55;color:var(--text);letter-spacing:.3px;
  box-shadow:0 0 18px rgba(255,210,74,.25);white-space:normal;}
.dl-row{display:flex;gap:10px;align-items:baseline;padding:6px 4px;border-bottom:1px solid rgba(20,42,60,.5);
  font-family:'IBM Plex Mono',monospace;font-size:9.5px;}
.dl-t{min-width:96px;color:var(--accent);font-family:'Orbitron',monospace;font-size:10.5px;letter-spacing:1px;}
.dl-t.hot{color:#ff5566;text-shadow:0 0 8px rgba(255,85,102,.6);animation:eppulse 1s infinite;}
.dl-name{flex:1;color:var(--text);}
.dl-pad{color:var(--muted);max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dl-st{color:var(--amber);min-width:30px;}
.dl-link{color:var(--purple);text-decoration:none;letter-spacing:.5px;}
.dl-link:hover{color:var(--accent);text-shadow:0 0 8px rgba(0,229,255,.6);}
#d-alert{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:14px;padding:12px 26px;
  background:rgba(4,16,10,.95);border:2px solid #00ff9d;
  box-shadow:0 0 34px rgba(0,255,157,.55),inset 0 0 28px rgba(0,255,157,.1);
  animation:alertglow 1.1s infinite;}
@keyframes alertglow{0%,100%{box-shadow:0 0 34px rgba(0,255,157,.55)}50%{box-shadow:0 0 60px rgba(0,255,157,.95)}}
.d-alert-pulse{font-size:28px;animation:bob 1.2s infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#d-alert-name{font-family:'Orbitron',monospace;font-size:16px;letter-spacing:2px;color:#00ff9d;text-shadow:0 0 12px rgba(0,255,157,.7);}
#d-alert-sub{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--text);letter-spacing:1px;margin-top:2px;}

/* ════ V5 · OBSERVER — pass table moves beside the sky plot (nothing obstructed) ════ */
#gt-panel #pass-table-wrap{display:none !important;} /* safety: never overlay the ground track */
#sky-split{display:flex;gap:8px;flex:1;min-height:0;align-items:stretch;margin-top:24px;}
#sky-split #pass-table-wrap{position:static !important;width:255px;min-width:230px;max-height:none;
  height:auto;flex:0 0 auto;overflow-y:auto;border-right:1px solid var(--line);
  background:rgba(2,8,14,.55);}
#sky-right{flex:1;min-width:0;position:relative;display:flex;}
#sky-right .plot-canvas{flex:1;width:100%;height:100%;}

/* ════ V5 · CATALOG — larger, more legible metadata card ════ */
#cat-card{width:330px !important;max-width:38vw;padding:12px 14px !important;}
#cc-name{font-size:15px !important;letter-spacing:1.5px;}
.cc-row{padding:3px 0 !important;}
.cc-k{font-size:9.5px !important;letter-spacing:1px;}
.cc-v{font-size:12.5px !important;}
#cat-card .hud-btn{font-size:10px;padding:5px 10px;}
.cg-item.cg-all{border-bottom:1px solid var(--line);color:var(--accent);font-weight:bold;}

/* ════ V5 · CONJUNCTION WATCH ════ */
#view-ca{display:none;grid-template-columns:330px 1fr;height:100%;}
#view-ca.active{display:grid;}
#ca-side{display:flex;flex-direction:column;border-right:1px solid var(--line);background:rgba(3,9,15,.6);min-height:0;}
#ca-side-head{border-bottom:1px solid var(--line);}
.sdot.red{background:#ff5566;box-shadow:0 0 8px #ff5566;}
#ca-list{flex:1;overflow-y:auto;min-height:0;}
.ca-row{padding:8px 10px;border-bottom:1px solid rgba(20,42,60,.5);cursor:pointer;}
.ca-row:hover{background:rgba(255,85,102,.06);}
.ca-row.sel{background:rgba(255,85,102,.12);border-left:3px solid #ff5566;}
.car-top{display:flex;justify-content:space-between;gap:8px;font-family:'IBM Plex Mono',monospace;}
.car-pair{font-size:9.5px;color:var(--text);letter-spacing:.3px;}
.car-rng{font-family:'Orbitron',monospace;font-size:11px;color:#ff5566;text-shadow:0 0 8px rgba(255,85,102,.5);white-space:nowrap;}
.car-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);margin-top:3px;letter-spacing:.4px;}
#ca-main{display:flex;flex-direction:column;min-height:0;}
#ca-head{padding:8px 14px;border-bottom:1px solid var(--line);}
#ca-pair-title{font-family:'Orbitron',monospace;font-size:14px;letter-spacing:2px;color:var(--text);}
#ca-stage{flex:1;position:relative;min-height:0;}
#ca-canvas-wrap{position:absolute;inset:0;}
#ca-info{position:absolute;top:10px;right:10px;width:285px;background:rgba(3,10,18,.93);
  border:1px solid #ff5566;box-shadow:0 0 24px rgba(255,85,102,.2);padding:10px 12px;
  font-family:'IBM Plex Mono',monospace;backdrop-filter:blur(3px);}
#ca-info:empty{display:none;}
#ca-info .ssi-name{color:#ff8896;text-shadow:0 0 10px rgba(255,85,102,.6);}
#ca-legend{position:absolute;left:10px;bottom:8px;display:flex;flex-wrap:wrap;gap:5px 14px;
  font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--text);background:rgba(2,8,14,.7);
  padding:5px 9px;border:1px solid var(--line);}
#ca-sma-panel{height:150px;border-top:1px solid var(--line);padding:6px 10px;background:rgba(2,8,14,.5);}
#ca-sma{width:100%;height:100%;display:block;}

/* ════ V5 · DISCOVERY expansion ════ */
.d-wide{grid-column:1/-1;}
#d-kp-spark{width:100%;height:36px;display:block;margin-top:6px;}
.dw-head{display:flex;align-items:baseline;justify-content:space-between;gap:6px;}
.dw-head .dw-v{font-size:15px;margin:2px 0;}
.dw-spark{width:100%;height:40px;display:block;margin:5px 0 3px;}
#d-kp-spark.dw-spark{height:40px;}

/* ── REENTRY WATCH panel ── */
.d-re-tabs{display:flex;gap:6px;margin:6px 0 2px;}
.d-re-tab.on{color:var(--accent);border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,.35);}
#d-re-list{display:flex;flex-direction:column;gap:5px;max-height:300px;overflow:auto;}
.dre-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;
  border-left:3px solid var(--amber);padding:5px 8px;background:rgba(255,170,0,.04);}
.dre-row.decay{border-left-color:var(--muted);background:rgba(255,255,255,.02);}
.dre-row.hot{border-left-color:var(--red);background:rgba(255,68,68,.06);}
.dre-name{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text);letter-spacing:.4px;}
.dre-eta{font-family:'Orbitron',monospace;font-size:12px;color:var(--amber);text-align:right;white-space:nowrap;}
.dre-eta.decay{color:var(--muted);}
.dre-eta.hot{color:var(--red);}
.dre-meta{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.5px;}
.dre-meta.r{text-align:right;}

/* ── CATALOG STATISTICS panel ── */
.dst-total{font-family:'Orbitron',monospace;font-size:30px;color:var(--accent);
  text-shadow:0 0 18px rgba(0,212,255,.4);line-height:1.05;margin:2px 0;}

(function(){

        x.onclick=()=>{box.remove();box=null;n=0;};

const MU_E=398600.4418,WE=7.2921150e-5,RE_KM=6378.137;

const padZ=n=>String(n).padStart(2,'0');
function fmtUTCTime(d){return padZ(d.getUTCHours())+':'+padZ(d.getUTCMinutes())+':'+padZ(d.getUTCSeconds());}
function fmtUTCShort(d){return padZ(d.getUTCHours())+':'+padZ(d.getUTCMinutes())+':'+padZ(d.getUTCSeconds());}
function fmtDateUTC(d){return d.getUTCFullYear()+'-'+padZ(d.getUTCMonth()+1)+'-'+padZ(d.getUTCDate())+' '+padZ(d.getUTCHours())+':'+padZ(d.getUTCMinutes());}

/* Robust local time formatting.
   Uses Intl with hour12:false but normalises the '24:xx' midnight quirk.
   Falls back to manual UTC-offset arithmetic if the IANA tz string is invalid. */
function fmtLocalTime(d, tz){
  // Primary: Intl (works when tz is a valid IANA string)
  try{
    let fmt=new Intl.DateTimeFormat('en-GB',{   // en-GB always gives HH:MM:SS, no AM/PM
      timeZone:tz,
      hour:'2-digit',minute:'2-digit',second:'2-digit',
      hour12:false
    });
    let str=fmt.format(d);
    // Normalise rare '24:xx:xx' -> '00:xx:xx'
    if(str.startsWith('24')) str='00'+str.slice(2);
    return str;
  }catch(e){}
  // Fallback: apply stored numeric offset (minutes)
  let local=new Date(d.getTime()+SITE.tzOffsetMin*60000);
  return padZ(local.getUTCHours())+':'+padZ(local.getUTCMinutes())+':'+padZ(local.getUTCSeconds());
}

/* Short version (HH:MM only) for pass table / meta strip */
function fmtLocalShort(d, tz){
  return fmtLocalTime(d,tz).slice(0,5);
}

/* ════ TIMEZONE LOOKUP ════ */
async function lookupTimezone(lat,lon){
  // 1) timeapi.io — most reliable free API
  try{
    let r=await fetch(`https://timeapi.io/api/timezone/coordinate?latitude=${lat}&amp;longitude=${lon}`,
      {signal:fetchTimeoutSignal(5000)});
    if(r.ok){
      let j=await r.json();
      if(j.timeZone &amp;&amp; j.timeZone.includes('/')) return j.timeZone;
    }
  }catch(e){}
  // 2) BigDataCloud reverse geocode (has timezone field)
  try{
    let r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&amp;longitude=${lon}&amp;localityLanguage=en`,
      {signal:fetchTimeoutSignal(4000)});
    if(r.ok){
      let j=await r.json();
      // BDC returns 'timezone' at top level since 2023
      if(j.timezone &amp;&amp; j.timezone.name) return j.timezone.name;
      if(j.countryCode){
        // Try to get offset from localityInfo
        let off=j.localityInfo?.informative?.find(x=>x.isoName==='UTC Offset');
        if(off) {/* fall through to offset calc */}
      }
    }
  }catch(e){}
  // 3) Fallback: estimate offset from longitude (±15° per hour)
  //    NOTE: Etc/GMT sign is INVERTED vs normal convention
  let offsetHr=Math.round(lon/15);
  // Clamp to ±12
  offsetHr=Math.max(-12,Math.min(12,offsetHr));
  // Etc/GMT-5 = UTC+5, Etc/GMT+5 = UTC-5  (POSIX convention, opposite of intuition)
  let etcSign=offsetHr>=0?'-':'+';
  return 'Etc/GMT'+etcSign+Math.abs(offsetHr);
}

/* Compute tzOffsetMin for a given IANA tz string (used as fallback in fmtLocalTime) */
function computeTZOffsetMin(tz){
  try{
    let now=new Date();
    // Get local time parts in the target tz
    let fmt=new Intl.DateTimeFormat('en-GB',{timeZone:tz,
      year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
    let parts=fmt.formatToParts(now);
    let get=t=>parseInt(parts.find(p=>p.type===t).value);
    let localMs=Date.UTC(get('year'),get('month')-1,get('day'),get('hour'),get('minute'),get('second'));
    return Math.round((localMs-now.getTime())/60000);
  }catch(e){return 0;}
}

/* ════ JULIAN DATE &amp; GMST ════ */
function julianDate(dt){
  let y=dt.getUTCFullYear(),mo=dt.getUTCMonth()+1,d=dt.getUTCDate();
  let h=dt.getUTCHours(),mn=dt.getUTCMinutes(),s=dt.getUTCSeconds()+dt.getUTCMilliseconds()/1e3;
  if(mo<=2){y--;mo+=12;}
  let A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(mo+1))+d+B-1524.5+(h+mn/60+s/3600)/24;
}
function gmst_from_jd(JD){
  let T=(JD-2451545.0)/36525.0;
  let s=67310.54841+(876600*3600+8640184.812866)*T+0.093104*T*T-6.2e-6*T*T*T;
  return((s%86400+86400)%86400)/240*Math.PI/180;
}

/* ════ TLE PARSE ════ */
function parseTleSci(s){
  let m=s.slice(0,6).replace(/ /g,'+');
  let sign=m[0]==='-'?-1:1;
  let mant=sign*(parseFloat(m.substring(1))/1e5);
  return mant*Math.pow(10,parseInt(s.slice(6,8),10)||0);
}
function parseTLE(name,l1,l2){
  if(!l1||!l2||l1.length<69||l2.length<69||l1[0]!=='1'||l2[0]!=='2') return null;
  try{
    let satnum=parseInt(l1.slice(2,7).trim());
    let yr2=parseInt(l1.slice(18,20));
    let doy=parseFloat(l1.slice(20,32));
    let bstar=0;try{bstar=parseTleSci(l1.slice(53,61));}catch(e){}
    let yr=yr2>=57?1900+yr2:2000+yr2;
    let epoch=new Date(Date.UTC(yr,0,1,0,0,0,0)+(doy-1)*86400000);
    let inc=parseFloat(l2.slice(8,16));
    let raan=parseFloat(l2.slice(17,25));
    let ecc=parseFloat('0.'+l2.slice(26,33).trim());
    let argp=parseFloat(l2.slice(34,42));
    let M=parseFloat(l2.slice(43,51));
    let n=parseFloat(l2.slice(52,63));
    if(isNaN(n)||n<=0) return null;
    let n_rad=n*2*Math.PI/86400;
    let a=Math.pow(MU_E/(n_rad*n_rad),1/3);
    let T_s=86400/n;
    let alt=a-RE_KM;
    let orbitType='LEO';
    if(ecc>0.25&amp;&amp;T_s>43200&amp;&amp;inc>50) orbitType='MOLNIYA';
    else if(ecc>0.15) orbitType='HEO';
    else if(T_s>80000) orbitType='GEO';
    else if(T_s>20000) orbitType='MEO';
    else orbitType='LEO';
    let fp_rad=Math.acos(RE_KM/(RE_KM+alt))*180/Math.PI;
    let fp_km=RE_KM*fp_rad*Math.PI/180;
    // Build SGP4 satrec — used for propagation
    let satrec=null;
    try{if(typeof satellite!=='undefined') satrec=satellite.twoline2satrec(l1,l2);}catch(e){}
    return{name,satnum,epoch,bstar,inc,raan,ecc,argp,M,n,n_rad,a,T_s,alt_km:alt,orbitType,fp_km,satrec};
  }catch(e){return null;}
}

/* ════ ORBITAL MECHANICS ════ */
function trueFromMean(M,e){
  M=((M%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
  let E=e>0.8?Math.PI:M;
  for(let k=0;k<60;k++){let dE=-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));E+=dE;if(Math.abs(dE)<1e-13)break;}
  return((2*Math.atan2(Math.sqrt(1+e)*Math.sin(E/2),Math.sqrt(1-e)*Math.cos(E/2)))+2*Math.PI)%(2*Math.PI);
}
function dcmPQW2ECI(Om,inc,w){
  let cO=Math.cos(Om),sO=Math.sin(Om),ci=Math.cos(inc),si=Math.sin(inc),cw=Math.cos(w),sw=Math.sin(w);
  return[cO*cw-sO*sw*ci,-cO*sw-sO*cw*ci,sO*si,sO*cw+cO*sw*ci,-sO*sw+cO*cw*ci,-cO*si,sw*si,cw*si,ci];
}
function mv3(M,v){return[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],M[3]*v[0]+M[4]*v[1]+M[5]*v[2],M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];}
function twoBP(x){
  let rx=x[0],ry=x[1],rz=x[2],rn=Math.sqrt(rx*rx+ry*ry+rz*rz),c=-MU_E/(rn*rn*rn);
  return[x[3],x[4],x[5],c*rx,c*ry,c*rz];
}
function rk4(x,dt){
  let k1=twoBP(x),x2=x.map((v,i)=>v+.5*dt*k1[i]);
  let k2=twoBP(x2),x3=x.map((v,i)=>v+.5*dt*k2[i]);
  let k3=twoBP(x3),x4=x.map((v,i)=>v+dt*k3[i]);
  let k4=twoBP(x4);
  return x.map((v,i)=>v+(dt/6)*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
}
function geo2ecef(lat,lon,h_m){
  let p=lat*Math.PI/180,l=lon*Math.PI/180,h=h_m/1000;
  let s=Math.sin(p),c=Math.cos(p),N=RE_KM/Math.sqrt(1-E2_WGS*s*s);
  return[(N+h)*c*Math.cos(l),(N+h)*c*Math.sin(l),(N*(1-E2_WGS)+h)*s];
}
function topoRotm(lat,lon){
  let p=lat*Math.PI/180,l=lon*Math.PI/180,sp=Math.sin(p),cp=Math.cos(p),sl=Math.sin(l),cl=Math.cos(l);
  return[-sl,cl,0,-sp*cl,-sp*sl,cp,cp*cl,cp*sl,sp];
}

/* ════ SGP4 PROPAGATOR — adaptive sampling ════
   Uses satellite.js (SGP4/SDP4) for physics.
   Step size adapts to altitude: dense near perigee, sparse at apogee.
   Falls back to two-body RK4 if satrec is unavailable.              */

function adaptiveStep(altKm, T_s){
  // Near perigee: short steps to capture sharp curvature
  // At apogee / GEO: long steps, motion is slow and nearly linear
  // Floor: 10s  Ceiling: min(T_s/60, 300s)
  let ceiling=Math.min(T_s/60, 300);
  let step=Math.max(10, Math.min(ceiling, altKm/30));
  return step;
}

function sgp4ECI(satrec, date){
  // Returns {r:[x,y,z], v:[vx,vy,vz]} in km, km/s ECI  — or null on error
  let m=(date.getTime()-Date.UTC(1970,0,1))/60000; // minutes since Unix epoch
  // satellite.js wants minutes since epoch
  let minutesSinceEpoch=(date-satrec.jdsatepoch_ms)/60000;
  // Use propagateFromMinutesAfterEpoch if available, otherwise propagate with date
  let pv;
  try{
    pv=satellite.propagate(satrec, date);
  }catch(e){return null;}
  if(!pv||!pv.position||pv.position===true) return null;
  return{r:[pv.position.x,pv.position.y,pv.position.z],
         v:[pv.velocity.x,pv.velocity.y,pv.velocity.z]};
}


/* ╔══════════════════════════════════════════════════════════════════╗

   ║  One master clock drives BOTH computation frameworks in lockstep: ║

/* robust fetch timeout: AbortSignal.timeout() is unavailable on older lab
   browsers — every network failure traced back to this. Polyfill-safe helper. */
function fetchTimeoutSignal(ms){
  try{if(typeof AbortSignal!=='undefined'&amp;&amp;AbortSignal.timeout) return AbortSignal.timeout(ms);}catch(e){}
  try{const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;}catch(e){return undefined;}
}

/* full public catalog (every tracked object CelesTrak publishes) with download
   progress; tries TLE-format GP dump first, then the classic catalog file. */
async function fetchFullCatalog(onProgress){
  const bases=['https://celestrak.org/NORAD/elements/gp.php?GROUP=active&amp;FORMAT=tle',
               'https://celestrak.org/pub/TLE/catalog.txt'];
  /* catalog.txt is the strict superset (payloads + R/B + debris, ~28k);
     try it FIRST, fall back to the active GP group */
  bases.reverse();
  for(const base of bases){
    const urls=[base,'https://corsproxy.io/?'+encodeURIComponent(base),
                'https://api.allorigins.win/raw?url='+encodeURIComponent(base)];
    for(const u of urls){
      try{
        const r=await fetch(u,{cache:'no-store',signal:fetchTimeoutSignal(60000)});
        if(!r.ok) continue;
        let txt='';
        if(r.body&amp;&amp;r.body.getReader){
          const rd=r.body.getReader(),dec=new TextDecoder();
          let got=0;
          for(;;){
            const{done,value}=await rd.read();
            if(done) break;
            got+=value.length;txt+=dec.decode(value,{stream:true});
            if(onProgress) onProgress(got);
          }
          txt+=dec.decode();
        } else txt=await r.text();
        if(/^1 \d{5}/m.test(txt)&amp;&amp;/^2 \d{5}/m.test(txt)&amp;&amp;!/<html/i.test(txt.slice(0,400))&amp;&amp;txt.length>50000) return txt;
      }catch(e){}
    }
  }
  return null;
}

   ║  MODULE · OrbitSmith public static data client                    ║
   ║  Static JSON snapshots (no API key) — serves three roles here:     ║
   ║   1. full ~34.6k catalog with object_type for the type filter     ║
   ║   2. offline / fallback catalog source when CelesTrak is blocked   ║
   ║   3. reentry-watch + active-catalog statistics for DISCOVERY       ║
   ║  Non-operational data — display &amp; triage only (per OrbitSmith).    ║

const OS={
  BASE:'https://orbitsmith.net/data/orbitsmith',
  _proxies:['','https://corsproxy.io/?','https://api.allorigins.win/raw?url='],
  attribution:'OrbitSmith · Space-Track/18 SDS · CelesTrak',
  /* direct fetch first (CORS-open static host), then public proxies */
  async _json(url,ms){
    for(let i=0;i<this._proxies.length;i++){
      const u=i===0?url:this._proxies[i]+encodeURIComponent(url);
      try{
        const r=await fetch(u,{cache:'no-store',signal:fetchTimeoutSignal(ms||15000)});
        if(!r.ok) continue;
        const j=await r.json();
        if(j&amp;&amp;typeof j==='object') return j;
      }catch(e){}
    }
    return null;
  },
  /* small bounded-concurrency map so 35 shards don't fire 35 sockets at once */
  async _pool(items,worker,conc){
    const out=new Array(items.length);let idx=0;
    const run=async()=>{ while(idx<items.length){const i=idx++;out[i]=await worker(items[i],i);} };
    await Promise.all(Array.from({length:Math.min(conc||6,items.length)},run));
    return out;
  },
  _normType(s){
    if(!s) return 'UNKNOWN';
    s=String(s).toUpperCase();
    if(s.indexOf('PAYLOAD')>=0) return 'PAYLOAD';
    if(s.indexOf('ROCKET')>=0||s==='R/B') return 'RB';
    if(s.indexOf('DEBRIS')>=0) return 'DEBRIS';
    return 'UNKNOWN';
  },
  /* FULL CATALOG → array of parseTLE objects tagged with objType/orbitClass/rcs.
     Returns null only if every shard (direct + proxied) is unreachable. */
  async fetchCatalog(onProgress){
    let idx=await this._json(this.BASE+'/gp/index/latest.json',20000);
    let shardUrls=null;
    if(idx&amp;&amp;Array.isArray(idx.shards)&amp;&amp;idx.shards.length){
      shardUrls=idx.shards.map(s=>s.url||(this.BASE+'/'+s.path));
    }else{
      /* index unreachable → derive the 35 known shard paths 000..034 */
      shardUrls=[];for(let i=0;i<35;i++) shardUrls.push(this.BASE+'/gp/shards/'+String(i).padStart(3,'0')+'.json');
    }
    const total=shardUrls.length;let done=0,gotAny=false;
    const byNorad=new Map();
    await this._pool(shardUrls,async(u)=>{
      const j=await this._json(u,30000);
      done++;
      if(onProgress) onProgress(done,total,byNorad.size);
      if(!j||!Array.isArray(j.records)) return;
      gotAny=true;
      for(const rec of j.records){
        if(byNorad.has(rec.norad_id)) continue;
        const t=parseTLE(rec.name||('OBJ '+rec.norad_id),rec.tle_line1,rec.tle_line2);
        if(!t||!t.satrec) continue;
        t.objType=this._normType(rec.object_type);
        t.orbitClass=rec.orbit_class||t.orbitType;
        t.rcs=rec.rcs_size||null;
        t.rawL1=rec.tle_line1;t.rawL2=rec.tle_line2;
        byNorad.set(rec.norad_id,t);
      }
    },6);
    if(!gotAny) return null;
    return [...byNorad.values()];
  },
  fetchReentry(){ return this._json(this.BASE+'/reentry/latest.json',15000); },
  fetchStatsToday(){ return this._json(this.BASE+'/statistics/today.json',12000); },
  fetchStatsRecent(){ return this._json(this.BASE+'/statistics/recent.json',15000); }
};

/* ════ V2 · ASTRO EXTENSIONS — azimuthal alt/az, solar vector, Earth shadow ════ */
const D2R=Math.PI/180, R2D=180/Math.PI;
function jdms(ms){return ms/86400000+2440587.5;}
function gmstDegAt(d){return ((280.46061837+360.98564736629*(jdms(d.getTime())-2451545))%360+360)%360;}

/* Equatorial (ra,dec radians) → topocentric alt/az in degrees. Az from North, clockwise. */
function eqToAltAz(ra,dec,d,latDeg,lonDeg){
  let lst=(gmstDegAt(d)+lonDeg)*D2R;
  let H=lst-ra;
  let lat=latDeg*D2R;
  let sinAlt=Math.sin(dec)*Math.sin(lat)+Math.cos(dec)*Math.cos(lat)*Math.cos(H);
  let alt=Math.asin(Math.max(-1,Math.min(1,sinAlt)))*R2D;
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(lat)-Math.tan(dec)*Math.cos(lat))*R2D; // from South, westward
  az=(az+180)%360; if(az<0)az+=360;
  return{alt,az};
}
/* Geocentric solar unit vector in true-of-date equatorial frame (≈TEME, <0.01° offset) */
function sunECIUnit(d){
  let s=sunPos(d);
  return[Math.cos(s.dec)*Math.cos(s.ra),Math.cos(s.dec)*Math.sin(s.ra),Math.sin(s.dec)];
}
/* Cylindrical Earth-shadow model (Vallado §5.3): eclipsed iff the satellite is on
   the anti-Sun side of Earth AND within one Earth radius of the shadow axis. */
function isSunlit(r,su){
  let s=r[0]*su[0]+r[1]*su[1]+r[2]*su[2];
  if(s>=0) return true;
  return (r[0]*r[0]+r[1]*r[1]+r[2]*r[2]-s*s) > RE_KM*RE_KM;
}

/* ════ V2 · PROPAGATOR — adaptive SGP4 sampling + per-sample illumination state ════ */
/* ── SatelliteService · SGP4 propagation over a configurable horizon ──
   durS: forecast depth in seconds (granular time-horizon control);
   anchor: epoch to propagate from (defaults to the global sim clock). */
function propagate(tle,durS,anchor){
  let now=anchor||new Date(typeof EPOCH!=='undefined'?EPOCH.ms()-300000:Date.now());
  let GMST0=gmst_from_jd(julianDate(now));
  let siteECEF=geo2ecef(SITE.lat_deg,SITE.lon_deg,SITE.h_m);
  let Re2enu=topoRotm(SITE.lat_deg,SITE.lon_deg);

  /* adaptive time array (unchanged physics: dense at perigee, sparse at apogee) */
  let tEnd=durS?Math.max(durS,0.25*tle.T_s):NUM_REVS*tle.T_s;
  let times=[]; let t=0;
  if(tle.satrec){
    let coarseStep=Math.max(30,tle.T_s/120);
    let altProfile=[]; let tc=0;
    while(tc<=tEnd){
      let d=new Date(now.getTime()+tc*1000);
      let pv=sgp4ECI(tle.satrec,d);
      let altEst=pv?Math.sqrt(pv.r[0]**2+pv.r[1]**2+pv.r[2]**2)-RE_KM:tle.alt_km;
      altProfile.push({tc,alt:Math.max(100,altEst)});
      tc+=coarseStep;
    }
    let pi=0;
    while(t<=tEnd+1){
      times.push(t);
      while(pi<altProfile.length-2&amp;&amp;altProfile[pi+1].tc<t) pi++;
      let alt=altProfile[pi].alt;
      if(pi+1<altProfile.length){
        let frac=(t-altProfile[pi].tc)/(altProfile[pi+1].tc-altProfile[pi].tc+1e-9);
        alt=altProfile[pi].alt+(altProfile[pi+1].alt-altProfile[pi].alt)*frac;
      }
      t+=adaptiveStep(Math.max(100,alt),tle.T_s);
    }
  } else {
    while(t<=tEnd){times.push(t);t+=adaptiveStep(tle.alt_km,tle.T_s);}
  }

  let N=times.length-1;
  let tArr=new Float64Array(N+1);
  let xECI_=new Float64Array((N+1)*3), xECEF_=new Float64Array((N+1)*3);
  let lat_=new Float64Array(N+1),lon_=new Float64Array(N+1);
  let az_=new Float64Array(N+1),el_=new Float64Array(N+1);
  let sunlit_=new Uint8Array(N+1), sunAlt_=new Float32Array(N+1);

  /* two-body fallback initial state */
  let x_tb=null;
  if(!tle.satrec){
    let dt_ep=(now.getTime()-tle.epoch.getTime())/1000;
    let M_now=((tle.M*Math.PI/180+tle.n_rad*dt_ep)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
    let e=tle.ecc,a=tle.a,inc_r=tle.inc*Math.PI/180;
    let RAAN=tle.raan*Math.PI/180,argp=tle.argp*Math.PI/180;
    let nu=trueFromMean(M_now,e);
    let p_=a*(1-e*e),r_=p_/(1+e*Math.cos(nu));
    let C=dcmPQW2ECI(RAAN,inc_r,argp);
    let sqp=Math.sqrt(MU_E/p_);
    let rECI=mv3(C,[r_*Math.cos(nu),r_*Math.sin(nu),0]);
    let vECI=mv3(C,[-sqp*Math.sin(nu),sqp*(e+Math.cos(nu)),0]);
    x_tb=[rECI[0],rECI[1],rECI[2],vECI[0],vECI[1],vECI[2]];
  }

  /* solar state cache — Sun moves 0.04°/min; refresh every 60 s of track time */
  let sunU=null,sunAltCache=0,sunCacheT=-1e9;

  for(let k=0;k<=N;k++){
    let t=times[k]; tArr[k]=t;
    let sd=new Date(now.getTime()+t*1000);
    let rx,ry,rz;
    if(tle.satrec){
      let pv=sgp4ECI(tle.satrec,sd);
      if(pv){rx=pv.r[0];ry=pv.r[1];rz=pv.r[2];}
      else{rx=0;ry=0;rz=RE_KM+500;}
    } else {
      rx=x_tb[0];ry=x_tb[1];rz=x_tb[2];
      if(k<N){let dt=times[k+1]-times[k];x_tb=rk4(x_tb,dt);}
    }
    xECI_[3*k]=rx;xECI_[3*k+1]=ry;xECI_[3*k+2]=rz;

    if(t-sunCacheT>=60||k===0){
      let sp=sunPos(sd);
      sunU=[Math.cos(sp.dec)*Math.cos(sp.ra),Math.cos(sp.dec)*Math.sin(sp.ra),Math.sin(sp.dec)];
      sunAltCache=eqToAltAz(sp.ra,sp.dec,sd,SITE.lat_deg,SITE.lon_deg).alt;
      sunCacheT=t;
    }
    sunlit_[k]=isSunlit([rx,ry,rz],sunU)?1:0;
    sunAlt_[k]=sunAltCache;

    let th=GMST0+WE*t,ct=Math.cos(th),st=Math.sin(th);
    let fx=ct*rx+st*ry,fy=-st*rx+ct*ry,fz=rz;
    xECEF_[3*k]=fx;xECEF_[3*k+1]=fy;xECEF_[3*k+2]=fz;
    lon_[k]=((Math.atan2(fy,fx)*180/Math.PI+540)%360)-180;
    lat_[k]=Math.atan2(fz,Math.sqrt(fx*fx+fy*fy))*180/Math.PI;
    let rho=[fx-siteECEF[0],fy-siteECEF[1],fz-siteECEF[2]];
    let enu=mv3(Re2enu,rho);
    let E_=enu[0],N__=enu[1],U_=enu[2],rng=Math.sqrt(E_*E_+N__*N__+U_*U_);
    az_[k]=((Math.atan2(E_,N__)*180/Math.PI)%360+360)%360;
    el_[k]=Math.asin(Math.max(-1,Math.min(1,U_/rng)))*180/Math.PI;
  }
  return{tArr,xECI:xECI_,xECEF:xECEF_,lat:lat_,lon:lon_,az:az_,el:el_,sunlit:sunlit_,sunAlt:sunAlt_,N,now,GMST0};
}

/* ════ V2 · PASSES — geometric passes + true-visibility classification ════
   A sample is VISIBLE when: elevation > 5°, the satellite is sunlit (cylindrical
   shadow model) AND the site Sun altitude < −6° (civil darkness or darker). */
const VIS_EL_MIN=5, VIS_SUN_MAX=-6;
function findPasses(az,el,t,sunlit,sunAlt){
  let N=t.length,passes=[];
  let i=0;
  while(i<N){
    if(el[i]>=0){
      let i0=i;while(i<N&amp;&amp;el[i]>=0) i++;let i1=i-1;
      let t_rise=t[i0];
      if(i0>0){let d=el[i0]-el[i0-1];if(Math.abs(d)>1e-12)t_rise=t[i0-1]+(0-el[i0-1])*(t[i0]-t[i0-1])/d;}
      let t_set=t[i1];
      if(i1<N-1){let d=el[i1+1]-el[i1];if(Math.abs(d)>1e-12)t_set=t[i1]+(0-el[i1])*(t[i1+1]-t[i1])/d;}
      let elpk=-Infinity,ipk=i0;
      for(let j=i0;j<=i1;j++) if(el[j]>elpk){elpk=el[j];ipk=j;}
      let p={i0,i1,t_rise,t_set,t_peak:t[ipk],el_peak:elpk,az_rise:az[i0],az_set:az[i1],az_peak:az[ipk]};
      /* visibility scan */
      if(sunlit&amp;&amp;sunAlt){
        let v0=-1,v1=-1,vPk=-1,vPkEl=-Infinity;
        for(let j=i0;j<=i1;j++){
          if(el[j]>VIS_EL_MIN&amp;&amp;sunlit[j]&amp;&amp;sunAlt[j]<VIS_SUN_MAX){
            if(v0<0)v0=j; v1=j;
            if(el[j]>vPkEl){vPkEl=el[j];vPk=j;}
          }
        }
        p.visible=v0>=0;
        if(p.visible){p.t_vis0=t[v0];p.t_vis1=t[v1];p.el_visPeak=vPkEl;p.t_visPeak=t[vPk];}
        p.why=p.visible?'VIS':(sunAlt[ipk]>=VIS_SUN_MAX?'DAY':'ECL');
      } else {p.visible=false;p.why='—';}
      passes.push(p);
    } else i++;
  }
  return passes;
}

/* ════ V2 · DEEP SEARCH — first truly visible window in the next 48 h ════ */
function findNextVisible(tle,hours=48){
  if(!tle.satrec) return null;
  let now=new Date();
  let siteECEF=geo2ecef(SITE.lat_deg,SITE.lon_deg,SITE.h_m);
  let Re2enu=topoRotm(SITE.lat_deg,SITE.lon_deg);
  let step=tle.T_s>20000?120:45;
  let sunU=null,sunAlt=0,sunT=-1e9;
  let inWin=false,win=null;
  for(let t=0;t<=hours*3600;t+=step){
    let d=new Date(now.getTime()+t*1000);
    if(t-sunT>=120){
      let sp=sunPos(d);
      sunU=[Math.cos(sp.dec)*Math.cos(sp.ra),Math.cos(sp.dec)*Math.sin(sp.ra),Math.sin(sp.dec)];
      sunAlt=eqToAltAz(sp.ra,sp.dec,d,SITE.lat_deg,SITE.lon_deg).alt;
      sunT=t;
    }
    let ok=false,elv=-90;
    if(sunAlt<VIS_SUN_MAX){ /* only bother with geometry if the sky is dark */
      let pv=sgp4ECI(tle.satrec,d);
      if(pv){
        let GM=gmst_from_jd(julianDate(d)),ct=Math.cos(GM),st=Math.sin(GM);
        let fx=ct*pv.r[0]+st*pv.r[1],fy=-st*pv.r[0]+ct*pv.r[1],fz=pv.r[2];
        let rho=[fx-siteECEF[0],fy-siteECEF[1],fz-siteECEF[2]];
        let enu=mv3(Re2enu,rho);
        let rng=Math.sqrt(enu[0]**2+enu[1]**2+enu[2]**2);
        elv=Math.asin(Math.max(-1,Math.min(1,enu[2]/rng)))*R2D;
        ok=elv>VIS_EL_MIN&amp;&amp;isSunlit(pv.r,sunU);
      }
    }
    if(ok&amp;&amp;!inWin){inWin=true;win={t0:t,t1:t,elPk:elv,tPk:t};}
    else if(ok){win.t1=t;if(elv>win.elPk){win.elPk=elv;win.tPk=t;}}
    else if(inWin){win.t1=t;return win;}
  }
  return inWin?win:null;
}

/* ════ V3 · THREE.JS FOUNDATION ════
   · realistic Earth (NASA blue-marble) with multi-CDN fallback chain
   · Milky-Way panoramic sky sphere (with procedural star fallback)
   · physically-placed Sun light: one key light aligned with the true solar
     vector at the scene's epoch + soft space-ambient (no fake fill lights) */
let eciThree=null,ecefThree=null;

/* ---- texture loader with fallback chain ---- */
function loadTexChain(urls,onOK,onFail){
  let i=0;
  const tryNext=()=>{
    if(i>=urls.length){if(onFail)onFail();return;}
    const u=urls[i++];
    const ld=new THREE.TextureLoader();
    ld.setCrossOrigin('anonymous');
    ld.load(u,t=>onOK(t),undefined,()=>tryNext());
  };
  tryNext();
}

function loadEarthTex(cb){loadEarthDay(cb);}

/* ---- shared damped inertial orbit controls ---- */
function makeOrbitCtrl(dom,camera,opts={}){
  const rad0=opts.rad||1000;
  const ctrl={theta:opts.theta??0.82,phi:opts.phi??1.08,rad:rad0,
              tTheta:opts.theta??0.82,tPhi:opts.phi??1.08,tRad:rad0,
              vT:0,vP:0,down:false,
              target:new THREE.Vector3(0,0,0),tTarget:new THREE.Vector3(0,0,0),
              minR:opts.minR||rad0*0.05,maxR:opts.maxR||rad0*30};
  function applyCam(){
    camera.position.set(ctrl.target.x+ctrl.rad*Math.sin(ctrl.phi)*Math.sin(ctrl.theta),
                        ctrl.target.y+ctrl.rad*Math.cos(ctrl.phi),
                        ctrl.target.z+ctrl.rad*Math.sin(ctrl.phi)*Math.cos(ctrl.theta));
    camera.lookAt(ctrl.target);
  }
  ctrl.setTarget=function(v,rad){ctrl.tTarget.copy(v);if(rad!==undefined)ctrl.tRad=Math.max(ctrl.minR,Math.min(ctrl.maxR,rad));};
  ctrl.clearTarget=function(){ctrl.tTarget.set(0,0,0);};
  applyCam();
  dom.style.touchAction='none';dom.style.cursor='grab';
  let px=0,py=0;
  dom.addEventListener('pointerdown',e=>{ctrl.down=true;px=e.clientX;py=e.clientY;ctrl.vT=0;ctrl.vP=0;dom.style.cursor='grabbing';try{dom.setPointerCapture(e.pointerId);}catch(_){}});
  dom.addEventListener('pointerup',()=>{ctrl.down=false;dom.style.cursor='grab';});
  dom.addEventListener('pointercancel',()=>ctrl.down=false);
  dom.addEventListener('pointermove',e=>{
    if(!ctrl.down)return;
    const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;
    const k=0.0052*Math.min(1.6,ctrl.rad/(rad0*0.8));
    ctrl.tTheta-=dx*k;ctrl.tPhi-=dy*k;
    ctrl.vT=-dx*k;ctrl.vP=-dy*k;
    ctrl.tPhi=Math.max(.04,Math.min(Math.PI-.04,ctrl.tPhi));
  });
  dom.addEventListener('wheel',e=>{
    e.preventDefault();
    ctrl.tRad=Math.max(ctrl.minR,Math.min(ctrl.maxR,ctrl.tRad*Math.exp(e.deltaY*.0012)));
  },{passive:false});
  dom.addEventListener('dblclick',()=>{ctrl.tRad=rad0;ctrl.tTheta=opts.theta??0.82;ctrl.tPhi=opts.phi??1.08;ctrl.tTarget.set(0,0,0);});
  ctrl.update=function(dt){
    if(!ctrl.down&amp;&amp;(Math.abs(ctrl.vT)>1e-5||Math.abs(ctrl.vP)>1e-5)){
      ctrl.tTheta+=ctrl.vT;ctrl.tPhi+=ctrl.vP;
      ctrl.tPhi=Math.max(.04,Math.min(Math.PI-.04,ctrl.tPhi));
      ctrl.vT*=0.93;ctrl.vP*=0.93;
    }
    const a=1-Math.exp(-dt*11);
    ctrl.theta+=(ctrl.tTheta-ctrl.theta)*a;
    ctrl.phi+=(ctrl.tPhi-ctrl.phi)*a;
    ctrl.rad+=(ctrl.tRad-ctrl.rad)*(1-Math.exp(-dt*9));
    ctrl.target.lerp(ctrl.tTarget,1-Math.exp(-dt*7));
    applyCam();
  };
  return ctrl;
}

/* ---- shared anti-aliased round marker texture (for Points/Sprites) ---- */
let _roundTexCache=null;
function roundDotTex(){
  if(_roundTexCache) return _roundTexCache;
  const cv=document.createElement('canvas');cv.width=cv.height=64;
  const cx=cv.getContext('2d');

  g.addColorStop(0.85,'rgba(255,255,255,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');
